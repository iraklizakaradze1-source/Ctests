<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>C-Test Prep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

:root[data-theme="dark"]{--bg:#101114;--card:#181a1f;--ink:#ecedef;--mut:#9097a3;--acc:#8aa8ff;--btn:#ecedef;--bi:#101114;--line:#2a2d35;--ok:#55c98a;--okbg:rgba(85,201,138,.14);--bad:#ff7b7b;--badbg:rgba(255,123,123,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:16px;cursor:pointer}
.sp{flex:1}main{max-width:820px;margin:auto;padding:24px 20px 72px}
h1{font-weight:600;font-size:26px;letter-spacing:-.01em;margin:.3em 0 .6em}h2{font-weight:600;font-size:19px;margin:.1em 0 .4em}h3{margin:.1em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:12px 0}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid transparent;border-radius:6px;padding:7px 14px;background:var(--btn);color:var(--bi);font-weight:500}
button:hover{opacity:.85}button.g{background:transparent;color:var(--ink);border-color:var(--line)}button.g:hover{background:var(--bg);opacity:1}button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;background:transparent;color:var(--ink);border:1px solid var(--line);text-transform:capitalize}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--bi);font-weight:600;font-size:12px;text-transform:uppercase}
.dd{position:relative}.menu{display:none;position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:12px;width:min(580px,calc(100vw - 24px));max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu.open{display:block}.menu.s{width:240px;padding:6px}.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;text-transform:capitalize}.mi:hover{background:var(--bg)}.mi.on{color:var(--acc);font-weight:500}.lab{font-size:13px;font-weight:500;color:var(--mut);padding:8px 10px 2px}
.users{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.ucard{width:180px;text-align:center;padding:28px 10px;cursor:pointer;border-radius:10px;background:var(--card);border:1px solid var(--line)}.ucard:hover{border-color:var(--acc)}
.ucard .av{width:64px;height:64px;font-size:26px;margin:0 auto 12px;font-weight:500}.ucard h3{font-weight:500;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.grid .card{margin:0}.tile{cursor:pointer}.tile:hover{border-color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.bar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.clock{font:500 28px/1 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;min-width:3.2ch}.btns{display:flex;gap:8px}
.src{font-size:13px;color:var(--mut);margin-bottom:4px}
.wrap{position:relative}.txt{white-space:pre-line;font:19px/2.5 ui-serif,Georgia,"Times New Roman",serif;transition:filter .3s}.txt.blur{filter:blur(9px);user-select:none;pointer-events:none}

.gap.wrong:hover::after{content:attr(data-c);position:absolute;bottom:108%;left:0;background:var(--btn);color:var(--bi);font:500 14px system-ui,sans-serif;padding:1px 10px;border-radius:6px;z-index:5;line-height:1.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}.tabs button:hover{background:var(--bg);opacity:1}.tabs button.on{background:var(--btn);color:var(--bi);border-color:var(--btn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:13px}
.stat{text-align:center}.stat b{display:block;font-size:26px;font-weight:500}.big{font-size:44px;font-weight:600;letter-spacing:-.02em}

details summary{cursor:pointer;font-weight:500}.tag{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:4px;padding:0 8px;margin:2px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;cursor:pointer}.row+.row{border-top:1px solid var(--line);border-radius:0}.row:hover{background:var(--bg)}.rt{font-weight:500}.rr{display:flex;gap:16px;align-items:center;white-space:nowrap}.rr b{font-weight:500;min-width:5.8em;text-align:right}
.fb .tabs{margin:8px 0 0}
#of select{font:inherit;font-size:12px;border-radius:5px;padding:2px 6px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.fb input.t{margin:0}
.xp{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--badbg);font-size:14px;line-height:1.5;text-align:left}.xp .k{text-decoration:line-through;color:var(--bad)}.xp div{color:var(--ink);margin-top:2px}

:root{--amb:#b26a00;--vio:#7a3fc2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--amb:#f0b35a;--vio:#c7a2ff}}
:root[data-theme="dark"]{--amb:#f0b35a;--vio:#c7a2ff}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:8px 0}
.pc{border:1px solid var(--c);border-radius:10px;padding:10px;transition:opacity .2s}.pc.dim{opacity:.35}
.ph{font-weight:600;color:var(--c);cursor:pointer}.ps{font-size:12px;color:var(--mut);margin:2px 0 8px;line-height:1.35}
.pp{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 10px;margin:2px 2px 0 0;font-size:13px}.pp.on{background:var(--c);color:var(--bg)}
.pp{display:inline-block}.pa{width:auto;margin:6px 0}.pa td,.pa th{padding:4px 14px 4px 0}.pa td:first-child{font-weight:600}
#of{position:relative;z-index:12}
.sdd{position:relative}.sdd>button{display:flex;gap:6px;align-items:center}.sdd>button b{font-weight:600}
.sm{display:none;position:absolute;right:0;top:calc(100% + 6px);width:min(310px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.14)}.sm.open{display:block}
.sdi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}.sdi:hover{background:var(--bg)}.sdi div{display:flex;flex-direction:column;line-height:1.35}.sdi .mut{font-size:12px}.sdi.on{color:var(--acc)}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:0 9px;border-radius:999px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.ast{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}.ast>div{display:flex;flex-direction:column;line-height:1.3}.ast b{font-weight:600;font-size:18px}.ast .mut{font-size:12px}
.win{background:var(--okbg);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

übertragen {ka|nn}. Dabei {mu|ss} man {ab|er} wissen, {da|ss} der {psychol|ogische} Einfluss {v|on} Farben {a|uf} einem {vollk|ommen} anderen Prinzip basiert als die Wirkung, die farbiges Licht hat, wenn es direkt auf die Haut trifft: In diesem Fall kann es auch die körperliche Gesundheit beeinflussen, nicht nur die seelische."}, {"id": "mun1-t4", "title": "München 1 · Text 4 – Klimawandel", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 1, Text 4", "text": "Der Klimawandel bedroht die Existenz unzähliger Menschen. So warnen Experten vom UN-Klimarat {da|vor}, dass {sc|hon} in {unge|fähr} 70 Jahren {vi|ele} Küstengebiete {du|rch} große {Überschw|emmungen} zerstört {wer|den} könnten. {Da|von} betroffen {wä|ren} Millionen {v|on} Menschen, {beso|nders} in {As|ien}. Unvorstellbar, {wel|che} sozialen {Prob|leme} dadurch {verur|sacht} würden, wenn auf einmal all diese Menschen eine neue Heimat suchen müssten! Dabei ist laut der Experten der Anstieg des Meeresspiegels nur eine von vielen erwartbaren Folgen des Klimawandels."}, {"id": "mun1-t5", "title": "München 1 · Text 5 – Sport", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 1, Text 5", "text": "Viele Menschen bewegen sich zu wenig, oft aus Faulheit oder weil sie viel arbeiten müssen. Dabei {we|iß} jeder, {w|ie} gesund {regelm|äßiger} Sport {i|st}. Doch {w|ie} viel {Ze|it} muss {m|an} tatsächlich {inves|tieren}, um {sei|nem} Körper {et|was} Gutes {z|u} tun? {D|ie} Weltgesundheitsorganisation {empf|iehlt} eine {ha|lbe} Stunde {p|ro} Tag – mindestens! Den meisten Menschen erscheint das jedoch in ihrem Alltag nicht machbar. Nun belegen neueste Studien: Bereits eine Viertelstunde Sport am Tag verlängert die Lebensdauer statistisch um ca. drei Jahre."}, {"id": "mun2-t1", "title": "München 2 · Text 1 – Rauchverbote", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 1", "text": "Ein Forscherteam der WHO hat positive Auswirkungen von Rauchverboten, Warnhinweisen auf Zigarettenschachteln und Abgaben für Tabak nachgewiesen: {Üb|er} sieben {Mill|ionen} Menschen {hät|ten} dadurch {v|or} einem {frühze|itigen} Tod {bewa|hrt} werden {kön|nen}. Dass {staat|liche} Maßnahmen {ge|gen} das {risk|ante} Rauchen {z|u} einem {s|o} guten {Resu|ltat} führen {wür|den}, sei {ka|um} vorhersehbar {gew|esen}. Man {empf|iehlt} daher, {d|ie} Tabaksteuer {schrit|tweise} zu {erh|öhen}, um {me|hr} Menschen {a|ls} bisher {v|om} Rauchen {abzuh|alten}. Viele {Jugen|dliche} würden schon jetzt ihr Geld lieber für ein Smartphone sparen. Das ist sicher sinnvoller als zu qualmen."}, {"id": "mun2-t2", "title": "München 2 · Text 2 – Zimmersuche", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 2", "text": "Die Würzburger Studentin Kristina Helmreich erfand im Jahr 2012 das sogenannte Speed-Dating bei der Zimmersuche: „Meine {eig|ene} Suche {na|ch} einer {Wohngeme|inschaft} hatte {mi|ch} unglaublich {vi|el} Mühe {geko|stet}. Deshalb {besc|hloss} ich, {regel|mäßig} ein {zeitsp|arendes}, unkompliziertes {Tre|ffen} für {intere|ssierte} Zimmersuchende {u|nd} Zimmeranbieter {z|u} organisieren. {Fü|nf} Minuten {müs|sen} jeweils {ausre|ichen}, um {herausz|ufinden}, ob {si|ch} die {bei|den} Gesprächspartner {über|haupt} ein {Le|ben} in {ei|ner} gemeinsamen {Woh|nung} vorstellen {kön|nen}. Nur {da|nn} gibt es einen Besichtigungstermin und im Idealfall auch einen Mietvertrag.“ Ein Erfolgsprojekt, wie ihre „Kunden“ meinen!"}, {"id": "mun2-t3", "title": "München 2 · Text 3 – Buchstabengröße", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 3", "text": "Neurowissenschaftler haben mit Hirnmessungen herausgefunden, wie uns die Größe von Buchstaben beeinflusst. {S|ie} dient {ni|cht} nur {d|er} Lenkung {uns|erer} Aufmerksamkeit. {I|st} etwas {i|n} besonders {gro|ßen} Buchstaben {gedr|uckt}, löst {e|s} auch {stär|kere} Emotionen {a|us}. Dabei {st|eht} jedoch {d|er} Inhalt {des|sen}, was {m|an} gerade {li|est}, überraschenderweise {er|st} an {zwe|iter} Stelle. {Oh|ne} Zweifel {wei|sen} diese {mess|baren} Gefühlsreaktionen {a|uf} die {eno|rme} Bedeutung {v|on} Schrift {i|n} alphabetisierten Gesellschaften hin. Testen Sie sich selbst, wenn Sie das nächste Mal ein Werbeplakat sehen."}, {"id": "bo-t1", "title": "Bochum · Text 1 – Berufsverkehr", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 1", "text": "Jeden Morgen müssen viele Leute pünktlich am Arbeitsplatz sein. Dazu {fah|ren} sie {entw|eder} mit {d|em} eigenen {Au|to} oder {s|ie} benutzen {öffen|tliche} Verkehrsmittel {w|ie} z.B. {Ba|hn}, Bus {od|er} Straßenbahn. {Ein|ige} fahren {m|it} dem {Fahrr|ad}. In {al|len} Fällen {si|nd} die {Str|aßen} zu {d|en} Hauptverkehrszeiten {verst|opft}; denn {im|mer} mehr {Mens|chen} wohnen {he|ute} nicht {me|hr} in {d|er} Innenstadt. {S|ie} leben {i|n} Vororten; {de|nn} da ist das Wohnen angenehmer. So nimmt die Zahl der Berufstätigen, die täglich hin und her fahren, weiter zu."}, {"id": "bo-t2", "title": "Bochum · Text 2 – Herr Peters", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 2", "text": "Herr Peters will seinen Sohn Robert vom Flughafen abholen. Robert {ha|t} in {d|er} Türkei {Url|aub} gemacht; {e|r} will {he|ute} Nachmittag {m|it} dem {Flugz|eug} zurückkommen. {Se|in} Vater {ste|igt} ins {Au|to} und {wi|ll} gerade {abfa|hren}, als {Fr|au} Peters {ru|ft}: „Bleib {hi|er}! Robert {ha|t} eben {m|it} mir {telef|oniert}, leider {h|at} er {kei|nen} Platz {me|hr} in {d|er} Maschine {beko|mmen} und {ka|nn} erst {mor|gen} kommen.“ Herr Peters steigt aus und geht wieder ins Haus."}, {"id": "bo-t3", "title": "Bochum · Text 3 – Frau Müller", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 3", "text": "Frau Müller erzählt ihrem Mann beim Mittagessen, was sie am Morgen erledigt hat: „Ich {b|in} zur {Spark|asse} gefahren, {ha|be} die {Mi|ete}, die {Telefonr|echnung} und {d|ie} Fernsehgebühren {bez|ahlt}. Ich {ha|be} auch 200 € {v|on} unserem {Ko|nto} abgehoben. {Dan|ach} bin {i|ch} zur {Po|st} gelaufen, {ha|be} dort {Postk|arten} gekauft {u|nd} das {Pa|ket} an {uns|ere} Tochter {abges|chickt}. Eben {b|in} ich {no|ch} bei {d|er} Stadtverwaltung {gew|esen}, um {m|ir} einen {Pa|ss} ausstellen zu lassen. Du siehst also: Ich war ununterbrochen unterwegs.“"}, {"id": "bo-t4", "title": "Bochum · Text 4 – Arbeitstag", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 4", "text": "Die Deutschen haben in der Regel einen Arbeitstag von etwa acht Stunden. Sie {arbe|iten} an {fü|nf} Tagen {i|n} der {Wo|che} und {mac|hen} mehrere {Woc|hen} im {Ja|hr} Urlaub. {E|in} Arbeitnehmer {h|at} normalerweise {dreiß|ig} Arbeitstage {jähr|lich} frei. {M|it} den {Wochene|nden} kann {m|an} auf {ei|ne} Urlaubsdauer {v|on} sechs {Woc|hen} kommen. {D|ie} Durchschnittszahlen {gel|ten} zwar {ni|cht} für {je|den} Erwerbstätigen {u|nd} für {je|den} Beruf, {ab|er} sie {ge|ben} doch den Berufsalltag vieler Menschen in Deutschland recht genau wieder."}, {"id": "bo-t5", "title": "Bochum · Text 5 – Parteien", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 5", "text": "In einer politischen Partei kommen Menschen mit gemeinsamen politischen Ansichten zusammen. Sie {kön|nen} das {Prog|ramm} ihrer {Par|tei} beeinflussen. {D|ie} Bürger {ei|nes} Staates {best|immen} in {fre|ien} Wahlen, {wel|che} Partei {d|ie} Regierung {bil|den} soll. {D|ie} Wahlen {si|nd} frei {u|nd} geheim. {S|o} darf {nie|mand} gezwungen {wer|den}, bestimmte {Poli|tiker} oder {Part|eien} zu {wäh|len} und {z|u} sagen, {w|en} er {gew|ählt} hat. {Na|ch} einigen {Jah|ren} gibt {e|s} wieder Wahlen, denn zu einem demokratischen Staat gehört der Regierungswechsel."}, {"id": "bo-t6", "title": "Bochum · Text 6 – Energie", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 6", "text": "Energie tritt in verschiedenen Formen auf, und sie hat von Anfang an die Geschichte des Menschen beeinflusst. Alles, {w|as} ein {Men|sch} tut, {d|ie} kleinste {Bewe|gung} wie {au|ch} die {grö|ßte} Anstrengung, {bra|ucht} Energie. {D|ie} menschliche {Kul|tur} von {ih|ren} Anfängen {b|is} heute {ka|nn} man {a|ls} eine {Gesch|ichte} immer {stär|kerer}, komplizierterer {Energien|utzung} betrachten. {Zue|rst} hatte {m|an} nur {Muskelk|raft} zur {Verf|ügung}. Schon {fr|üh} benutzten {Mens|chen} auch {Fe|uer}, um {Spe|isen} zu {koc|hen}. Aber es dauerte Jahrtausende, bis Wärmekraftmaschinen erfunden wurden."}, {"id": "da-t1", "title": "Darmstadt · Text 1 – Urlaubsreise", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 1", "text": "Bei der Planung von Urlaubsreisen ins Ausland sollte man bedenken: Nur {d|as} mitnehmen, {w|as} man {wirk|lich} braucht! {Da|zu} gehören {i|n} jedem {Fa|ll} die {Reisedoku|mente}, ein {gu|ter} Reiseführer {u|nd} ein {Wörter|buch}, die {Ti|ckets} sowie {ei|ne} Adressenliste. {We|lche} Kleidung {m|an} einpackt, {hä|ngt} vom {Zi|el} ab. {W|er} alleine {unte|rwegs} ist, {br|aucht} für {Notf|älle} eine {kle|ine} Reiseapotheke. {Obw|ohl} man {Ge|ld} fast {übe|rall} einfach {wech|seln} oder {abh|eben} kann, {empf|iehlt} es {si|ch}, eine {kle|ine} Summe {sc|hon} vor {d|er} Reise {umzuta|uschen}: Und {schli|eßlich} gehört {no|ch} etwas {i|m} Gepäck: Der eigene Hausschlüssel."}, {"id": "da-t2", "title": "Darmstadt · Text 2 – Einstein", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 2", "text": "Lange lebte die Familie Einstein in einer Mietwohnung in Berlin. Im Frühjahr 1929 {pl|ante} Albert Einstein {d|en} Bau {ei|nes} eigenen {Hau|ses}. Die {Fam|ilie} hatte {zw|ar} nur {we|nig} Geld, {ab|er} Einsteins {Tra|um} war {e|in} kleines {Ha|us} im {Grü|nen}, wo {e|r} in {Ru|he} nachdenken {kon|nte}. Als {e|s} dann {m|it} der {Pl|anung} endlich {sow|eit} war, {kontro|llierte} Einstein {d|ie} statischen {Berech|nungen} des {gepl|anten} Baus, {k|am} aber {z|u} anderen {Ergeb|nissen} als {vor|her} der {Arch|itekt}. Einsteins {Ass|istent} überprüfte {al|les} noch {ein|mal}. Zu {sei|ner} großen {Überra|schung} aber {mus|ste} er etwas {fests|tellen}: Der berühmte Physiker hatte sich beim Multiplizieren vertan."}, {"id": "da-t3", "title": "Darmstadt · Text 3 – Moung Yin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 3", "text": "Moung Yin stammt aus Taiwan. Sie {le|bt} aber {sc|hon} lange {i|n} Deutschland. Sie {erz|ählt}: “Wenn {me|ine} Familie {a|us} Taiwan {z|u} Besuch {ko|mmt}, merke {i|ch} immer, {w|ie} sehr {w|ir} uns {hi|er} schon {angep|asst} haben. {Me|in} Vater {z|um} Beispiel {ka|nn} es {überh|aupt} nicht {vers|tehen}, dass {me|in} Mann {sc|hon} seit {üb|er} zehn {Jah|ren} bei {derse|lben} großen {Fi|rma} arbeitet. {E|r} hat {au|ch} kein {Verst|ändnis} dafür, {da|ss} wir {ge|rn} in {Url|aub} fahren, {we|nn} wir {e|in} {Bedür|fnis} nach {Ru|he} und {Erho|lung} haben. Im Vergleich zu Asien wird in Deutschland sehr wenig gearbeitet.”"}, {"id": "da-t4", "title": "Darmstadt · Text 4 – Märchenerzählerin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 4", "text": "Eine Märchenerzählerin sitzt auf gleicher Höhe mit ihrem Publikum. Dieses {sit|zt} direkt {u|m} sie {he|rum}. Ihre {Au|gen} suchen {im|mer} wieder {d|en} Blickkontakt {m|it} einzelnen {Pers|onen} als {o|b} sie {ei|ne} Antwort {erwa|rten} würde. {Ih|re} Körperhaltung {i|st} zuerst {völ|lig} entspannt, {da|nn} wieder {dyna|misch} angespannt. {Ih|re} Hände {si|nd} immer {i|n} Bewegung: {Ges|ten} laden {al|le} zum {Mitd|enken} und {Fra|gen} ein, {verdeu|tlichen} die {Fig|uren}, zeigen {au|ch}, wie {gr|oß} oder {kl|ein} die {Zuh|örer} sich {et|was} vorstellen {sol|len}. Das {wicht|igste} Requisit {ble|ibt} aber {oh|ne} Zweifel {ih|re} Stimme. Mit dieser verzaubert sie ihre Zuhörer."}, {"id": "t-bo-g1", "cat": "task", "title": "Grammatik · Präpositionen & Endungen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 1", "text": "Edwin Land wurde {|am} 7. Mai 1909 in Bridgetown an der Ostküste Nordamerika{|s} geboren. {|Mit} 17 Jahren nahm er {|an} der Aufnahmeprüfung für d{|ie} berühmte Harvard-Universität teil. Er gehörte {|zu} den besten Kandidaten und bekam ein{|en} Studienplatz. Aber schon {|nach} ein paar Monaten brach der hochbegabt{|e} Mann sein Studium ab, zog in d{|ie} Millionenstadt New York, wohnte dort in ein{|er} Kellerwohnung und arbeitete an ungelöst{|en} Problemen d{|er} Physik. Erst Jahre später kehrte er {|an} die Harvard-Universität zurück."}, {"id": "t-bo-g2", "cat": "task", "title": "Grammatik · Konjunktionen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 2", "text": "Die Harvard-Universität stellte dem hochbegabten Edwin Land ein eigenes Labor zur Verfügung, {|damit/so dass} er die besten Bedingungen für seine Forschung hatte. {|Nachdem} er einige interessante Erfindungen gemacht hatte, gründete Land eine eigene Firma, {|um} seine Ideen vermarkten zu können. Er verließ die Universität, {|denn} er wollte sich mit ganzer Kraft um seine Firma kümmern. {|Als} er 1943 am Geburtstag seiner Tochter viele Photos von dem dreijährigen Mädchen machte, fragte die Kleine, {|ob} sie die Bilder sofort sehen könne. Diese naive Frage des Kindes führte dazu, {|dass} der Vater eine geniale Idee entwickelte. {|Während} die Kinder im Garten spielten, dachte der Vater darüber nach, {|wie} er eine Sofortbildkamera konstruieren könnte. Noch {|bevor} der Tag zu Ende war, hatte er die Lösung. Seine Tochter Jennifer war sehr zufrieden, {|weil} sie in Zukunft ihre Geburtstagsbilder sofort ansehen konnte. {|Obwohl} Edwin Land durch seine nächste Erfindung 70 Millionen Dollar verlor, blieb er einer der reichsten Männer Amerikas."}, {"id": "t-ki-g", "cat": "task", "title": "Grammatik · Akkusativ oder Dativ", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 4.3", "text": "Der Zug fuhr {|in den} Bahnhof ein.\nSeit wann lebst du {|in der} Schweiz?\n{|Hinter dem} Tisch befindet sich eine Wand.\nSie zweifeln {|an der} Richtigkeit der Aussage.\nSie steigt jeden Abend um 18:00 Uhr {|in den} Bus.\nIch komme {|aus der} Kleinstadt.\n{|An die} Wand hänge ich ein großes Bild.\nDer Vogel landete {|auf dem} Dach.\nDarf ich {|hinter dem} Bahnhof parken?"}, {"id": "t-ki-w1", "cat": "task", "title": "Wortschatz · Wortfamilien", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.1", "text": "hoch – Komparativ: {|höher} · Nomen: {|die Höhe}\nwarm – Komparativ: {|wärmer} · Nomen: {|die Wärme}\ntrocken – Komparativ: {|trockener} · Nomen: {|die Trockenheit}\nfrisch – Komparativ: {|frischer} · Nomen: {|die Frische}\nleicht – Komparativ: {|leichter} · Nomen: {|die Leichtigkeit}\nhart – Komparativ: {|härter} · Nomen: {|die Härte}"}, {"id": "t-ki-w2", "cat": "task", "title": "Wortschatz · Synonyme", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.2", "text": "reich – {|wohlhabend}\narm – {|mittellos}\ndirekt – {|unmittelbar}\ngeeignet – {|passend}\nhübsch – {|attraktiv}\nvollständig – {|komplett}\neinfach – {|leicht}\nkompliziert – {|komplex}"}, {"id": "wiki-t1", "title": "Wikipedia · Text 1 – Kaffee", "source": "Wikipedia (de) – Artikel „Kaffee“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Kaffee gehört zu den beliebtesten Getränken der Welt. Er {wi|rd} aus {d|en} gerösteten {Sam|en} der {Kaffeep|flanze} hergestellt, {d|ie} vor {all|em} in {tropi|schen} Ländern {w|ie} Brasilien {u|nd} Vietnam {wäc|hst}. Nach {d|er} Ernte {wer|den} die {Früc|hte} getrocknet, {gesc|hält} und {anschl|ießend} bei {hoh|en} Temperaturen {gerö|stet}. Dabei {entst|ehen} erst {d|ie} typischen {Aro|men}. In Deutschland trinkt jeder Einwohner im Durchschnitt mehr als 150 Liter Kaffee pro Jahr."}, {"id": "wiki-t2", "title": "Wikipedia · Text 2 – Fahrrad", "source": "Wikipedia (de) – Artikel „Fahrrad“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Fahrrad ist eines der wichtigsten Verkehrsmittel für kurze Strecken. Der {ers|te} Vorläufer {wur|de} von {d|em} Mannheimer {Ka|rl} Drais {erfu|nden} und {hat|te} noch {kei|ne} Pedale. {M|an} schob {si|ch} mit {d|en} Füßen {v|om} Boden {a|b}. Erst {Jahrz|ehnte} später {wur|den} Kurbeln {a|m} Vorderrad {angeb|racht}, wodurch {d|as} Fahren {deut|lich} bequemer {u|nd} schneller {wur|de}. Heute gibt es weltweit mehr als eine Milliarde Fahrräder."}, {"id": "wiki-t3", "title": "Wikipedia · Text 3 – Rhein", "source": "Wikipedia (de) – Artikel „Rhein“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Rhein zählt zu den längsten und wichtigsten Flüssen Europas. Er {entsp|ringt} in {d|en} Schweizer {Alp|en} und {fli|eßt} durch {mehr|ere} Länder, {bev|or} er {i|n} den {Nieder|landen} in {d|ie} Nordsee {mün|det}. Besonders {beka|nnt} ist {d|as} Obere {Mittelr|heintal} mit {sei|nen} steilen {Weinb|ergen} und {vie|len} Burgen. {D|er} Fluss {die|nt} außerdem {a|ls} bedeutende {Wasser|straße} für den Güterverkehr. Das Mittelrheintal gehört zum UNESCO-Welterbe."}, {"id": "wiki-t4", "title": "Wikipedia · Text 4 – Buchdruck", "source": "Wikipedia (de) – Artikel „Buchdruck“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Buchdruck mit beweglichen Lettern veränderte Europa grundlegend. Mitte {d|es} fünfzehnten {Jahrhu|nderts} entwickelte {Joha|nnes} Gutenberg {i|n} Mainz {e|in} Verfahren, {b|ei} dem {einz|elne} Buchstaben {a|us} Metall {gego|ssen} wurden. {Die|se} Lettern {kon|nte} man {beli|ebig} zusammensetzen {u|nd} immer {wie|der} verwenden. {Dadu|rch} wurden {Büc|her} viel {bill|iger} und {f|ür} breitere {Schic|hten} erschwinglich. So verbreiteten sich neue Ideen schneller als je zuvor."}, {"id": "wiki-t5", "title": "Wikipedia · Text 5 – Mond", "source": "Wikipedia (de) – Artikel „Mond“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Mond ist der einzige natürliche Satellit der Erde. Er {umkr|eist} unseren {Plan|eten} in {kna|pp} vier {Woc|hen} und {zei|gt} uns {dab|ei} immer {dies|elbe} Seite. {We|il} er {sel|bst} nicht {leuc|htet}, reflektiert {e|r} nur {d|as} Licht {d|er} Sonne. {D|ie} wechselnden {Mondp|hasen} entstehen {dadu|rch}, dass {w|ir} den {beleuc|hteten} Teil {a|us} unterschiedlichen {Wink|eln} sehen. Im Jahr 1969 betraten erstmals Menschen seine Oberfläche."}, {"id": "wiki-t6", "title": "Wikipedia · Text 6 – Honigbiene", "source": "Wikipedia (de) – Artikel „Westliche Honigbiene“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Honigbiene ist ein wichtiges Nutztier des Menschen. Sie {le|bt} in {gro|ßen} Völkern, {d|ie} aus {ein|er} Königin, {eini|gen} hundert {Droh|nen} und {vie|len} tausend {Arbeite|rinnen} bestehen. {D|ie} Arbeiterinnen {samm|eln} Nektar {u|nd} Pollen, {bau|en} Waben {u|nd} versorgen {d|ie} Brut. {Auße|rdem} bestäuben {s|ie} zahlreiche {Blü|ten}, wodurch {d|ie} Ernte {v|on} Obst {u|nd} Gemüse gesichert wird. Deshalb gilt ihr Rückgang als ernstes Problem für die Landwirtschaft."}, {"id": "wiki-t7", "title": "Wikipedia · Text 7 – Alpen", "source": "Wikipedia (de) – Artikel „Alpen“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Alpen erstrecken sich über acht Länder in Mitteleuropa. Der {höch|ste} Berg {i|st} der {Mo|nt} Blanc {a|n} der {Gre|nze} zwischen {Frank|reich} und {Ital|ien}. Das {Gebi|rge} entstand, {a|ls} die {afrika|nische} und {d|ie} eurasische {Pla|tte} zusammenstießen. {Heu|te} kommen {jed|es} Jahr {Milli|onen} Touristen {z|um} Wandern {u|nd} Skifahren {i|n} die {Reg|ion}. Dadurch ist der Tourismus für viele Alpentäler die wichtigste Einnahmequelle."}, {"id": "wiki-t8", "title": "Wikipedia · Text 8 – Schokolade", "source": "Wikipedia (de) – Artikel „Schokolade“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Schokolade wird aus den Samen des Kakaobaums hergestellt. Der {Ba|um} wächst {n|ur} in {d|er} Nähe {d|es} Äquators, {v|or} allem {i|n} Westafrika {u|nd} Südamerika. {D|ie} Kakaobohnen {wer|den} fermentiert, {getro|cknet} und {anschl|ießend} zu {ein|er} Masse {gema|hlen}. Für {Milchsch|okolade} mischt {m|an} diese {Mas|se} mit {Zuc|ker} und {Milchp|ulver}. Danach {wi|rd} sie {gewa|lzt}, erhitzt und in Form gebracht. Schon die Azteken tranken Kakao als bitteres Getränk."}, {"id": "wiki-t9", "title": "Wikipedia · Text 9 – Eisbär", "source": "Wikipedia (de) – Artikel „Eisbär“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Eisbär ist das größte an Land lebende Raubtier der Erde. Er {le|bt} in {d|er} Arktis {u|nd} jagt {hauptsä|chlich} Robben, {d|ie} er {a|n} Atemlöchern {i|m} Eis {erwa|rtet}. Sein {dich|tes} Fell {u|nd} eine {dic|ke} Fettschicht {schü|tzen} ihn {v|or} der {extr|emen} Kälte. {We|il} das {Meer|eis} durch {d|ie} Erderwärmung {imm|er} früher {schm|ilzt}, hat {e|r} weniger Zeit für die Jagd. Deshalb gilt die Art als gefährdet."}, {"id": "wiki-t10", "title": "Wikipedia · Text 10 – Internet", "source": "Wikipedia (de) – Artikel „Internet“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Internet verbindet heute Milliarden von Geräten auf der ganzen Welt. Seine {Urspr|ünge} liegen {i|n} einem {amerika|nischen} Forschungsnetz, {m|it} dem {Univers|itäten} Daten {austau|schen} konnten. {Spä|ter} entwickelte {T|im} Berners-Lee {a|m} Forschungszentrum {CE|RN} die {Grund|lagen} des {Wor|ld} Wide {W|eb}. Dadurch {konn|ten} auch {Lai|en} Seiten {aufr|ufen} und {mitein|ander} verknüpfen. {Inzwi|schen} nutzen {e|s} Menschen {fa|st} überall zum Lernen und Arbeiten. Ohne diese Entwicklung wäre unser Alltag kaum vorstellbar."}, {"id": "wiki-t11", "title": "Wikipedia · Text 11 – Wasser", "source": "Wikipedia (de) – Artikel „Wasser“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Wasser ist die Grundlage allen Lebens auf der Erde. Rund {sieb|zig} Prozent {d|er} Erdoberfläche {si|nd} von {Was|ser} bedeckt, {do|ch} nur {e|in} kleiner {Te|il} davon {i|st} Süßwasser. {E|s} kommt {a|ls} Flüssigkeit, {a|ls} Eis {u|nd} als {Dam|pf} vor. {Dur|ch} Verdunstung, {Wolkenb|ildung} und {Reg|en} befindet {si|ch} das {Was|ser} in {ein|em} ständigen {Kreis|lauf}. Dieser Kreislauf sorgt dafür, dass es auf dem Land immer wieder frisches Wasser gibt. Ein erwachsener Mensch besteht zu mehr als der Hälfte aus Wasser."}, {"id": "wiki-t12", "title": "Wikipedia · Text 12 – Fußball", "source": "Wikipedia (de) – Artikel „Fußball“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Fußball ist die beliebteste Sportart der Welt. Zwei {Mannsc|haften} mit {jewe|ils} elf {Spie|lern} versuchen, {d|en} Ball {i|ns} gegnerische {T|or} zu {beför|dern}. Außer {d|em} Torwart {dür|fen} die {Spie|ler} den {Ba|ll} nicht {m|it} den {Hän|den} berühren. {E|in} Spiel {dau|ert} neunzig {Minu|ten} und {wi|rd} von {ein|em} Schiedsrichter {gele|itet}. Wenn {ei|ne} Mannschaft das Regelwerk verletzt, bekommt die andere einen Freistoß oder sogar einen Elfmeter zugesprochen. Die Weltmeisterschaft findet alle vier Jahre statt."}, {"id": "wiki-t13", "title": "Wikipedia · Text 13 – Vulkan", "source": "Wikipedia (de) – Artikel „Vulkan“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Ein Vulkan ist eine Stelle der Erdoberfläche, an der Magma austritt. Tief {i|m} Inneren {d|er} Erde {schm|ilzt} Gestein {dur|ch} die {ho|he} Hitze. {Die|ses} flüssige {Gest|ein} steigt {na|ch} oben, {we|il} es {leic|hter} ist {a|ls} seine {Umge|bung}. Bei {ein|em} Ausbruch {wer|den} Lava, {Asc|he} und {Ga|se} aus {d|em} Krater {geschl|eudert}. Viele {Vulk|ane} liegen {a|n} den Rändern der Erdplatten, zum Beispiel rund um den Pazifik. Der Ätna auf Sizilien gehört zu den aktivsten Vulkanen Europas."}, {"id": "wiki-t14", "title": "Wikipedia · Text 14 – Elefanten", "source": "Wikipedia (de) – Artikel „Elefanten“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Elefanten sind die größten Landtiere der Erde. Man {untersc|heidet} den {Afrikan|ischen} und {d|en} Asiatischen {Elefa|nten}, die {si|ch} vor {all|em} an {d|er} Größe {ihr|er} Ohren {erke|nnen} lassen. {D|ie} Tiere {leb|en} in {Her|den}, die {v|on} einer {erfah|renen} Kuh {angef|ührt} werden. {M|it} ihrem {Rüs|sel} können {s|ie} greifen, {trin|ken} und {riec|hen}. Pro Tag fressen sie mehr als hundert Kilogramm Pflanzen und legen dafür oft weite Strecken zurück. Wegen der Jagd nach Elfenbein sind viele Bestände stark zurückgegangen."}, {"id": "wiki-t15", "title": "Wikipedia · Text 15 – Mozart", "source": "Wikipedia (de) – Artikel „Wolfgang Amadeus Mozart“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Wolfgang Amadeus Mozart wurde im Jahr 1756 in Salzburg geboren. Schon {a|ls} kleines {Ki|nd} spielte {e|r} hervorragend {Klav|ier} und {Gei|ge} und {tr|at} mit {sei|nem} Vater {u|nd} seiner {Schwe|ster} an {europä|ischen} Fürstenhöfen {a|uf}. Später {z|og} er {na|ch} Wien, {w|o} er {a|ls} freier {Kompo|nist} arbeitete. {E|r} schrieb {zahlr|eiche} Sinfonien, {Konz|erte} und {Ope|rn}, darunter die Zauberflöte. Seine Musik wird bis heute auf der ganzen Welt gespielt. Mozart starb bereits mit fünfunddreißig Jahren."}, {"id": "wiki-t16", "title": "Wikipedia · Text 16 – Solarenergie", "source": "Wikipedia (de) – Artikel „Solarenergie“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Solarenergie nutzt die Strahlung der Sonne zur Gewinnung von Strom oder Wärme. In {Solarz|ellen} wird {d|as} Licht {dir|ekt} in {elektr|ischen} Strom {umgewa|ndelt}. Solche {Zel|len} bestehen {mei|st} aus {Sili|zium} und {wer|den} zu {gro|ßen} Modulen {zusamme|ngefügt}. Man {fin|det} sie {a|uf} Hausdächern {ebe|nso} wie {a|uf} freien {Feld|ern}. Ein {Nach|teil} ist, {da|ss} nachts {u|nd} bei {bewöl|ktem} Himmel weniger Energie erzeugt wird. Deshalb braucht man Batterien, um den Strom zu speichern."}, {"id": "wiki-t17", "title": "Wikipedia · Text 17 – Schlaf", "source": "Wikipedia (de) – Artikel „Schlaf“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Schlaf ist ein natürlicher Ruhezustand, der für die Gesundheit unverzichtbar ist. Während {w|ir} schlafen, {erh|olt} sich {d|er} Körper {u|nd} das {Geh|irn} verarbeitet {d|ie} Eindrücke {d|es} Tages. {D|ie} Nacht {best|eht} aus {mehr|eren} Zyklen, {d|ie} jeweils {et|wa} neunzig {Minu|ten} dauern. {Erwac|hsene} brauchen {i|m} Durchschnitt {sie|ben} bis {ne|un} Stunden {Sch|laf}. Wer {dauer|haft} zu {wen|ig} schläft, kann sich schlechter konzentrieren und wird häufiger krank. Deshalb sollte man auf regelmäßige Schlafzeiten achten."}, {"id": "wiki-t18", "title": "Wikipedia · Text 18 – Tee", "source": "Wikipedia (de) – Artikel „Tee“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Tee gehört nach Wasser zu den meistgetrunkenen Getränken der Welt. Er {wi|rd} aus {d|en} Blättern {d|er} Teepflanze {herges|tellt}, die {ursprü|nglich} aus {Chi|na} stammt. {J|e} nach {Verarb|eitung} unterscheidet {m|an} zum {Beis|piel} grünen {u|nd} schwarzen {T|ee}. Für {schwa|rzen} Tee {wer|den} die {Blät|ter} fermentiert, {wodu|rch} sie {dun|kel} werden {u|nd} ein {kräfti|geres} Aroma {beko|mmen}. Heute wird Tee auch in Indien, Kenia und Sri Lanka angebaut. In Ostfriesland trinkt man besonders viel davon."}, {"id": "wiki-t19", "title": "Wikipedia · Text 19 – Regenwald", "source": "Wikipedia (de) – Artikel „Tropischer Regenwald“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Tropische Regenwälder wachsen in warmen Gebieten mit sehr viel Niederschlag. Der {grö|ßte} zusammenhängende {Regen|wald} der {Er|de} liegt {i|m} Amazonasbecken {i|n} Südamerika. {Obw|ohl} diese {Wäl|der} nur {ein|en} kleinen {Te|il} der {Landf|läche} bedecken, {le|bt} dort {e|in} großer {Te|il} aller Tier- und {Pflanze|narten}. Außerdem {speic|hern} die {Bäu|me} große {Men|gen} Kohlenstoff. {Dur|ch} Rodung {f|ür} Ackerland {ge|ht} jedes Jahr ein Stück davon verloren. Deshalb fordern viele Experten einen besseren Schutz."}, {"id": "wiki-t20", "title": "Wikipedia · Text 20 – Eisenbahn", "source": "Wikipedia (de) – Artikel „Eisenbahn“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Eisenbahn veränderte im neunzehnten Jahrhundert das Reisen und den Handel. Die {ers|te} Strecke {i|n} Deutschland {wur|de} 1835 {zwis|chen} Nürnberg {u|nd} Fürth {eröf|fnet}. Sie {w|ar} nur {wen|ige} Kilometer {la|ng}, doch {ba|ld} entstand {e|in} dichtes {Ne|tz} aus {Schi|enen}. Dadurch {konn|ten} Waren {u|nd} Menschen {vi|el} schneller {transpo|rtiert} werden {a|ls} mit {Pferde|wagen}. Auch {d|ie} Industrie profitierte, weil Kohle und Stahl leicht in alle Regionen gelangten. Heute fahren viele Züge elektrisch."},{"id": "wiki-t21", "title": "Wikipedia · Text 21 – Berliner Mauer", "source": "Wikipedia (de) – Artikel „Berliner Mauer“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Berliner Mauer teilte von 1961 bis 1989 die Stadt Berlin in einen östlichen und einen westlichen Teil. Die {Regi|erung} der DDR ließ {s|ie} im {Aug|ust} 1961 {ba|uen}, weil {im|mer} mehr {Mens|chen} das {La|nd} in {Rich|tung} Westen {verl|assen} hatten. {D|ie} Grenzanlage {w|ar} insgesamt {ru|nd} 155 {Kilo|meter} lang {u|nd} umschloss {ga|nz} West-Berlin. {W|er} trotzdem {vers|uchte} zu {fli|ehen}, geriet {i|n} große {Gef|ahr}, und {vi|ele} Menschen {verl|oren} dabei {i|hr} Leben. {A|m} 9. November 1989 öffneten die Behörden überraschend die Grenze, und Tausende feierten an der Mauer. Danach wurde der größte Teil der Anlage abgerissen. Heute erinnern nur noch einzelne Reste und eine Gedenkstätte an die Teilung der Stadt. Die Wiedervereinigung Deutschlands folgte am 3. Oktober 1990."},{"id": "wiki-t22", "title": "Wikipedia · Text 22 – Photosynthese", "source": "Wikipedia (de) – Artikel „Photosynthese“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Photosynthese ist ein Prozess, bei dem Pflanzen, Algen und manche Bakterien Lichtenergie in chemische Energie umwandeln. Dafür {neh|men} sie {Kohlenst|offdioxid} aus {d|er} Luft {u|nd} Wasser {a|us} dem {Bo|den} auf. {Mith|ilfe} des {grü|nen} Farbstoffs {Chlor|ophyll}, der {si|ch} in {d|en} Chloroplasten {befi|ndet}, entstehen {dar|aus} Traubenzucker {u|nd} Sauerstoff. {D|er} Zucker {di|ent} der {Pfl|anze} als {Baus|toff} und {Energi|equelle}, während {d|er} Sauerstoff {a|n} die {Umge|bung} abgegeben {wi|rd}. Ohne {die|sen} Vorgang {gä|be} es auf der Erde weder genügend Nahrung noch ausreichend Sauerstoff zum Atmen. Die Geschwindigkeit der Photosynthese hängt unter anderem von der Lichtmenge, der Temperatur und dem Angebot an Kohlenstoffdioxid ab. Deshalb wachsen Pflanzen im Sommer meist schneller als im Winter."},{"id": "wiki-t23", "title": "Wikipedia · Text 23 – Olympische Spiele", "source": "Wikipedia (de) – Artikel „Olympische Spiele“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Olympischen Spiele sind das größte Sportereignis der Welt. Schon {i|m} antiken {Griech|enland} fanden {s|ie} alle {vi|er} Jahre {z|u} Ehren {d|es} Gottes {Ze|us} in {Oly|mpia} statt. {D|er} französische {Päda|goge} Pierre de Coubertin {bel|ebte} die {Id|ee} im {neunz|ehnten} Jahrhundert {n|eu}, sodass 1896 in {At|hen} die {ers|ten} modernen {Spi|ele} veranstaltet {wur|den}. Seitdem {fin|den} Sommerspiele {u|nd} Winterspiele {st|att}, die {jew|eils} in {ei|ner} anderen {St|adt} ausgetragen werden. Tausende Sportlerinnen und Sportler aus über 200 Ländern nehmen daran teil und kämpfen um Medaillen. Die fünf olympischen Ringe stehen für die fünf Kontinente. Kritiker bemängeln allerdings, dass die Ausrichtung für die Gastgeber sehr teuer ist."},{"id": "wiki-t24", "title": "Wikipedia · Text 24 – Windenergie", "source": "Wikipedia (de) – Artikel „Windenergie“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Windenergie ist die Energie, die in bewegter Luft steckt und mit Windkraftanlagen in Strom umgewandelt wird. Der {Wi|nd} dreht {d|ie} Rotorblätter, {d|ie} über {ei|ne} Welle {ei|nen} Generator {antr|eiben}. Besonders {vi|el} Strom {lie|fern} Anlagen {a|n} der {Kü|ste} und {a|uf} dem {Me|er}, weil {do|rt} der {Wi|nd} stärker {u|nd} gleichmäßiger {we|ht}. In {Deuts|chland} stammt {inzwi|schen} ein {gro|ßer} Teil {d|es} erzeugten {Str|oms} aus {die|ser} Quelle. {D|ie} Technik {verur|sacht} im {Bet|rieb} kein Kohlenstoffdioxid und braucht keinen Brennstoff. Allerdings stören manche Anwohner der Lärm und der Anblick der hohen Türme, und auch Vögel können durch die Rotoren zu Schaden kommen. Außerdem liefert der Wind nicht immer gleich viel Energie, sodass man Strom speichern oder anders erzeugen muss."},{"id": "wiki-t25", "title": "Wikipedia · Text 25 – Venedig", "source": "Wikipedia (de) – Artikel „Venedig“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Venedig ist eine Stadt in Norditalien, die auf mehr als hundert kleinen Inseln in einer Lagune liegt. Statt {Str|aßen} durchziehen {ru|nd} 170 {Kan|äle} die {Alts|tadt}, und {d|ie} Bewohner {nut|zen} Boote {u|nd} Brücken, {u|m} sich {fortzu|bewegen}. Die {Häu|ser} stehen {a|uf} Holzpfählen, {d|ie} tief {i|n} den {wei|chen} Boden {getr|ieben} wurden. {I|m} Mittelalter {w|ar} Venedig {a|ls} Handelsmacht {se|hr} reich, {u|nd} Schiffe {brac|hten} Gewürze {u|nd} Seide {a|us} dem {Ori|ent}. Davon {zeu|gen} heute noch der Markusplatz und der Dogenpalast. Jedes Jahr besuchen Millionen Touristen die Stadt, was für die Einwohner auch Probleme mit sich bringt. Außerdem steigt der Meeresspiegel, sodass bei Hochwasser oft Plätze und Gassen überflutet werden."},{"id": "wiki-t26", "title": "Wikipedia · Text 26 – Mount Everest", "source": "Wikipedia (de) – Artikel „Mount Everest“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Mount Everest ist mit knapp 8850 Metern der höchste Berg der Erde. Er {li|egt} im {Hima|laya} an {d|er} Grenze {zwis|chen} Nepal {u|nd} China. {I|m} Jahr 1953 erreichten {e|in} neuseeländischer {Bergs|teiger} und {e|in} nepalesischer {She|rpa} als {Er|ste} den {Gip|fel}. Seitdem {vers|uchen} jedes {Ja|hr} viele {Bergs|teiger}, dieses {Zi|el} ebenfalls {z|u} erreichen. {Da|bei} müssen {s|ie} gegen {eis|ige} Kälte, {sta|rken} Wind {u|nd} dünne {Lu|ft const tabs=`<div class="tabs">${[['sum','Summary'],['mis','Mistake history'],['log','Attempt log']].map(([k,l])=>`<button class="${stTab===k?'on':''}" onclick="stTab='${k}';R.stats()">${l}</button>`).join('')}</div>`;let body='';
if(stTab==='sum'){const s=(l,v)=>`<div class="card stat"><b>${v}</b><span class="mut">${l}</span></div>`;body=`<div class="grid">${s('Attempts',n)}${s('Total mistakes',mis)}${s('Avg accuracy',n?Math.round(A.reduce((x,a)=>x+a.correct/a.total,0)/n*100)+'%':'–')}${s('Avg time',n?fmt(A.reduce((x,a)=>x+a.secs,0)/n):'–')}${s('Best accuracy',n?Math.round(Math.max(...A.map(a=>a.correct/a.total))*100)+'%':'–')}${s('Perfect runs',A.filter(a=>!a.mistakes.length).length)}${s('Avg time per gap',n?(A.reduce((x,a)=>x+a.secs/a.total,0)/n).toFixed(1)+'s':'–')}${s('Total practice',fmt(A.reduce((x,a)=>x+a.secs,0)))}</div>`}

function tstat(u,id){const A=D.attempts.filter(a=>a.user===u&&a.testId===id).sort((x,y)=>x.ts-y.ts),n=A.length;
if(!n)return{n:0,acc:null,need:.5,last:0,label:'New',c:'--mut'};
let w=0,sm=0;A.forEach((a,i)=>{w+=i+1;sm+=(i+1)*a.correct/a.total});const acc=sm/w,last=A[n-1].ts,days=(Date.now()-last)/864e5,need=(1-acc)+Math.min(.15,days*.01);
const lab=n>=2&&acc>=.9?['Mastered','--ok']:acc>=.7?['Good','--acc']:acc>=.5?['Shaky','--amb']:['Hard','--bad'];
return{n,acc,need,last,label:lab[0],c:lab[1]}}

if(!pool.length)pool=base;if(!pool.length){go(isT?'home':'list');return}
const r=pool.map(t=>({t,s:tstat(D.me,t.id)})).sort((a,b)=>b.s.need-a.s.need),top=r.filter(x=>x.s.need>=r[0].s.need-.05),p=top[Math.floor(Math.random()*top.length)];
openTest(p.t.id,p.s)}

if(!A.length)return'<h3>Your attempts</h3><p class="mut" style="margin:6px 0 0">No attempts on this text yet.</p>';
const pc=a=>Math.round(a.correct/a.total*100),n=A.length,avg=Math.round(A.reduce((x,a)=>x+a.correct/a.total,0)/n*100),bs=Math.max(...A.map(pc))+'%',at=Math.round(A.reduce((x,a)=>x+a.secs,0)/n);
const bl=(v,l)=>`<div><b>${v}</b><span class="mut">${l}</span></div>`;
let h=`<h3>Your attempts</h3><div class="ast">${bl(n,'tries')}${bl(avg+'%','avg accuracy')}${bl(n>1?pc(A[0])+'% → '+pc(A[n-1])+'%':pc(A[0])+'%',n>1?'first → latest':'first try')}${bl(bs,'best accuracy')}${bl(fmt(at),'avg time')}<div><span class="chip" style="--c:var(${st.c})">${st.label}</span></div></div>`;
h+=`<table><tr><th>#</th><th>When</th><th>Result</th><th>Accuracy</th><th>Time</th></tr>${A.map((a,i)=>`<tr><td>${i+1}</td><td>${new Date(a.ts).toLocaleDateString()} ${new Date(a.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${a.correct}/${a.total}</td><td>${pc(a)}%</td><td>${fmt(a.secs)}</td></tr>`).reverse().join('')}</table>`;
const g={};A.forEach(a=>a.mistakes.forEach(m=>{(g[m.gap]=g[m.gap]||{m,l:[]}).l.push(m)}));const ks=Object.keys(g).sort((x,y)=>g[y].l.length-g[x].l.length);
if(ks.length){h+=T&&T.checked&&T.test.id===t.id?`<div class="lab" style="padding-left:0;margin-top:14px">Most-missed gaps</div><table><tr><th>Gap</th><th>Answer</th><th>Your mistakes</th><th>Wrong</th></tr>${ks.slice(0,8).map(k=>{const{m,l}=g[k];return`<tr><td>#${+k+1}</td><td><b>${esc(m.correct)}</b></td><td>${l.map(x=>`<span class="tag">${esc(x.given+(x.typed||'…'))}</span>`).join('')}</td><td>${l.length}/${n}</td></tr>`}).join('')}</table>`:'<p class="mut" style="margin:12px 0 0">Your most-missed gaps appear here after you check this run.</p>'}
