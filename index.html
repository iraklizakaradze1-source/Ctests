<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>C-Test Prep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--ink:#17191e;--mut:#6a707c;--acc:#2b59c3;--btn:#17191e;--bi:#fff;--line:#e1e4ea;--ok:#1f7a4a;--okbg:#e6f4ec;--bad:#c53030;--badbg:#fbeaea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#101114;--card:#181a1f;--ink:#ecedef;--mut:#9097a3;--acc:#8aa8ff;--btn:#ecedef;--bi:#101114;--line:#2a2d35;--ok:#55c98a;--okbg:rgba(85,201,138,.14);--bad:#ff7b7b;--badbg:rgba(255,123,123,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:16px;cursor:pointer}
.sp{flex:1}main{max-width:820px;margin:auto;padding:24px 20px 72px}
h1{font-weight:600;font-size:26px;letter-spacing:-.01em;margin:.3em 0 .6em}h2{font-weight:600;font-size:19px;margin:.1em 0 .4em}h3{margin:.1em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:12px 0}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid transparent;border-radius:6px;padding:7px 14px;background:var(--btn);color:var(--bi);font-weight:500}
button:hover{opacity:.85}button.g{background:transparent;color:var(--ink);border-color:var(--line)}button.g:hover{background:var(--bg);opacity:1}button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;background:transparent;color:var(--ink);border:1px solid var(--line);text-transform:capitalize}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--bi);font-weight:600;font-size:12px;text-transform:uppercase}
.dd{position:relative}.menu{display:none;position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:12px;width:min(580px,calc(100vw - 24px));max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu.open{display:block}.menu.s{width:240px;padding:6px}.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;text-transform:capitalize}.mi:hover{background:var(--bg)}.mi.on{color:var(--acc);font-weight:500}.lab{font-size:13px;font-weight:500;color:var(--mut);padding:8px 10px 2px}
.users{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.ucard{width:180px;text-align:center;padding:28px 10px;cursor:pointer;border-radius:10px;background:var(--card);border:1px solid var(--line)}.ucard:hover{border-color:var(--acc)}
.ucard .av{width:64px;height:64px;font-size:26px;margin:0 auto 12px;font-weight:500}.ucard h3{font-weight:500;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.grid .card{margin:0}.tile{cursor:pointer}.tile:hover{border-color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.bar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line)}

.src{font-size:13px;color:var(--mut);margin-bottom:4px}
.wrap{position:relative}.txt{white-space:pre-line;font:19px/2.5 ui-serif,Georgia,"Times New Roman",serif;transition:filter .3s}.txt.blur{filter:blur(9px);user-select:none;pointer-events:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
.gap{display:inline-flex;white-space:nowrap;align-items:baseline;position:relative}
.gap input{font:inherit;line-height:1.3;height:1.3em;width:6.5em;flex:none;border:0;border-bottom:1px solid var(--mut);background:transparent;color:var(--ink);padding:0 2px;outline:0;border-radius:0}
.gap input:focus{border-bottom:2px solid var(--acc)}
.gap.ok input{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.gap.wrong input{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.gap.wrong:hover::after{content:attr(data-c);position:absolute;bottom:108%;left:0;background:var(--btn);color:var(--bi);font:500 14px system-ui,sans-serif;padding:1px 10px;border-radius:6px;z-index:5;line-height:1.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}.tabs button:hover{background:var(--bg);opacity:1}.tabs button.on{background:var(--btn);color:var(--bi);border-color:var(--btn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:13px}
.stat{text-align:center}.stat b{display:block;font-size:26px;font-weight:500}.big{font-size:44px;font-weight:600;letter-spacing:-.02em}
textarea,input.t{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);margin:4px 0 10px;outline:0}
textarea:focus,input.t:focus{border-color:var(--acc)}
details summary{cursor:pointer;font-weight:500}.tag{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:4px;padding:0 8px;margin:2px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;cursor:pointer}.row+.row{border-top:1px solid var(--line);border-radius:0}.row:hover{background:var(--bg)}.rt{font-weight:500}.rr{display:flex;gap:16px;align-items:center;white-space:nowrap}.rr b{font-weight:500;min-width:4.5em;text-align:right}
.fb .tabs{margin:8px 0 0}
#of select{font:inherit;font-size:12px;border-radius:5px;padding:2px 6px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.fb input.t{margin:0}
.xp{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--badbg);font-size:14px;line-height:1.5;text-align:left}.xp .k{text-decoration:line-through;color:var(--bad)}.xp div{color:var(--ink);margin-top:2px}

:root{--amb:#b26a00;--vio:#7a3fc2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--amb:#f0b35a;--vio:#c7a2ff}}
:root[data-theme="dark"]{--amb:#f0b35a;--vio:#c7a2ff}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:8px 0}
.pc{border:1px solid var(--c);border-radius:10px;padding:10px;transition:opacity .2s}.pc.dim{opacity:.35}
.ph{font-weight:600;color:var(--c);cursor:pointer}.ps{font-size:12px;color:var(--mut);margin:2px 0 8px;line-height:1.35}
.pp{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 10px;margin:2px 2px 0 0;font-size:13px}.pp.on{background:var(--c);color:var(--bg)}
.pa{width:auto;margin:6px 0}.pa td,.pa th{padding:4px 14px 4px 0}.pa td:first-child{font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

übertragen {ka|nn}. Dabei {mu|ss} man {ab|er} wissen, {da|ss} der {psychol|ogische} Einfluss {v|on} Farben {a|uf} einem {vollk|ommen} anderen Prinzip basiert als die Wirkung, die farbiges Licht hat, wenn es direkt auf die Haut trifft: In diesem Fall kann es auch die körperliche Gesundheit beeinflussen, nicht nur die seelische."}, {"id": "mun1-t4", "title": "München 1 · Text 4 – Klimawandel", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 1, Text 4", "text": "Der Klimawandel bedroht die Existenz unzähliger Menschen. So warnen Experten vom UN-Klimarat {da|vor}, dass {sc|hon} in {unge|fähr} 70 Jahren {vi|ele} Küstengebiete {du|rch} große {Überschw|emmungen} zerstört {wer|den} könnten. {Da|von} betroffen {wä|ren} Millionen {v|on} Menschen, {beso|nders} in {As|ien}. Unvorstellbar, {wel|che} sozialen {Prob|leme} dadurch {verur|sacht} würden, wenn auf einmal all diese Menschen eine neue Heimat suchen müssten! Dabei ist laut der Experten der Anstieg des Meeresspiegels nur eine von vielen erwartbaren Folgen des Klimawandels."}, {"id": "mun1-t5", "title": "München 1 · Text 5 – Sport", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 1, Text 5", "text": "Viele Menschen bewegen sich zu wenig, oft aus Faulheit oder weil sie viel arbeiten müssen. Dabei {we|iß} jeder, {w|ie} gesund {regelm|äßiger} Sport {i|st}. Doch {w|ie} viel {Ze|it} muss {m|an} tatsächlich {inves|tieren}, um {sei|nem} Körper {et|was} Gutes {z|u} tun? {D|ie} Weltgesundheitsorganisation {empf|iehlt} eine {ha|lbe} Stunde {p|ro} Tag – mindestens! Den meisten Menschen erscheint das jedoch in ihrem Alltag nicht machbar. Nun belegen neueste Studien: Bereits eine Viertelstunde Sport am Tag verlängert die Lebensdauer statistisch um ca. drei Jahre."}, {"id": "mun2-t1", "title": "München 2 · Text 1 – Rauchverbote", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 1", "text": "Ein Forscherteam der WHO hat positive Auswirkungen von Rauchverboten, Warnhinweisen auf Zigarettenschachteln und Abgaben für Tabak nachgewiesen: {Üb|er} sieben {Mill|ionen} Menschen {hät|ten} dadurch {v|or} einem {frühze|itigen} Tod {bewa|hrt} werden {kön|nen}. Dass {staat|liche} Maßnahmen {ge|gen} das {risk|ante} Rauchen {z|u} einem {s|o} guten {Resu|ltat} führen {wür|den}, sei {ka|um} vorhersehbar {gew|esen}. Man {empf|iehlt} daher, {d|ie} Tabaksteuer {schrit|tweise} zu {erh|öhen}, um {me|hr} Menschen {a|ls} bisher {v|om} Rauchen {abzuh|alten}. Viele {Jugen|dliche} würden schon jetzt ihr Geld lieber für ein Smartphone sparen. Das ist sicher sinnvoller als zu qualmen."}, {"id": "mun2-t2", "title": "München 2 · Text 2 – Zimmersuche", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 2", "text": "Die Würzburger Studentin Kristina Helmreich erfand im Jahr 2012 das sogenannte Speed-Dating bei der Zimmersuche: „Meine {eig|ene} Suche {na|ch} einer {Wohngeme|inschaft} hatte {mi|ch} unglaublich {vi|el} Mühe {geko|stet}. Deshalb {besc|hloss} ich, {regel|mäßig} ein {zeitsp|arendes}, unkompliziertes {Tre|ffen} für {intere|ssierte} Zimmersuchende {u|nd} Zimmeranbieter {z|u} organisieren. {Fü|nf} Minuten {müs|sen} jeweils {ausre|ichen}, um {herausz|ufinden}, ob {si|ch} die {bei|den} Gesprächspartner {über|haupt} ein {Le|ben} in {ei|nem} gemeinsamen {Woh|nung} vorstellen {kön|nen}. Nur {da|nn} gibt es einen Besichtigungstermin und im Idealfall auch einen Mietvertrag.“ Ein Erfolgsprojekt, wie ihre „Kunden“ meinen!"}, {"id": "mun2-t3", "title": "München 2 · Text 3 – Buchstabengröße", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 3", "text": "Neurowissenschaftler haben mit Hirnmessungen herausgefunden, wie uns die Größe von Buchstaben beeinflusst. {S|ie} dient {ni|cht} nur {d|er} Lenkung {uns|erer} Aufmerksamkeit. {I|st} etwas {i|n} besonders {gro|ßen} Buchstaben {gedr|uckt}, löst {e|s} auch {stär|kere} Emotionen {a|us}. Dabei {st|eht} jedoch {d|er} Inhalt {des|sen}, was {m|an} gerade {li|est}, überraschenderweise {er|st} an {zwe|iter} Stelle. {Oh|ne} Zweifel {wei|sen} diese {mess|baren} Gefühlsreaktionen {a|uf} die {eno|rme} Bedeutung {v|on} Schrift {i|n} alphabetisierten Gesellschaften hin. Testen Sie sich selbst, wenn Sie das nächste Mal ein Werbeplakat sehen."}, {"id": "bo-t1", "title": "Bochum · Text 1 – Berufsverkehr", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 1", "text": "Jeden Morgen müssen viele Leute pünktlich am Arbeitsplatz sein. Dazu {fah|ren} sie {entw|eder} mit {d|em} eigenen {Au|to} oder {s|ie} benutzen {öffen|tliche} Verkehrsmittel {w|ie} z.B. {Ba|hn}, Bus {od|er} Straßenbahn. {Ein|ige} fahren {m|it} dem {Fahrr|ad}. In {al|len} Fällen {si|nd} die {Str|aßen} zu {d|en} Hauptverkehrszeiten {verst|opft}; denn {im|mer} mehr {Mens|chen} wohnen {he|ute} nicht {me|hr} in {d|er} Innenstadt. {S|ie} leben {i|n} Vororten; {de|nn} da ist das Wohnen angenehmer. So nimmt die Zahl der Berufstätigen, die täglich hin und her fahren, weiter zu."}, {"id": "bo-t2", "title": "Bochum · Text 2 – Herr Peters", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 2", "text": "Herr Peters will seinen Sohn Robert vom Flughafen abholen. Robert {ha|t} in {d|er} Türkei {Url|aub} gemacht; {e|r} will {he|ute} Nachmittag {m|it} dem {Flugz|eug} zurückkommen. {Se|in} Vater {ste|igt} ins {Au|to} und {wi|ll} gerade {abfa|hren}, als {Fr|au} Peters {ru|ft}: „Bleib {hi|er}! Robert {ha|t} eben {m|it} mir {telef|oniert}, leider {h|at} er {kei|nen} Platz {me|hr} in {d|er} Maschine {beko|mmen} und {ka|nn} erst {mor|gen} kommen.“ Herr Peters steigt aus und geht wieder ins Haus."}, {"id": "bo-t3", "title": "Bochum · Text 3 – Frau Müller", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 3", "text": "Frau Müller erzählt ihrem Mann beim Mittagessen, was sie am Morgen erledigt hat: „Ich {b|in} zur {Spark|asse} gefahren, {ha|be} die {Mi|ete}, die {Telefonr|echnung} und {d|ie} Fernsehgebühren {bez|ahlt}. Ich {ha|be} auch 200 € {v|on} unserem {Ko|nto} abgehoben. {Dan|ach} bin {i|ch} zur {Po|st} gelaufen, {ha|be} dort {Postk|arten} gekauft {u|nd} das {Pa|ket} an {uns|ere} Tochter {abges|chickt}. Eben {b|in} ich {no|ch} bei {d|er} Stadtverwaltung {gew|esen}, um {m|ir} einen {Pa|ss} ausstellen zu lassen. Du siehst also: Ich war ununterbrochen unterwegs.“"}, {"id": "bo-t4", "title": "Bochum · Text 4 – Arbeitstag", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 4", "text": "Die Deutschen haben in der Regel einen Arbeitstag von etwa acht Stunden. Sie {arbe|iten} an {fü|nf} Tagen {i|n} der {Wo|che} und {mac|hen} mehrere {Woc|hen} im {Ja|hr} Urlaub. {E|in} Arbeitnehmer {h|at} normalerweise {dreiß|ig} Arbeitstage {jähr|lich} frei. {M|it} den {Wochene|nden} kann {m|an} auf {ei|ne} Urlaubsdauer {v|on} sechs {Woc|hen} kommen. {D|ie} Durchschnittszahlen {gel|ten} zwar {ni|cht} für {je|den} Erwerbstätigen {u|nd} für {je|den} Beruf, {ab|er} sie {ge|ben} doch den Berufsalltag vieler Menschen in Deutschland recht genau wieder."}, {"id": "bo-t5", "title": "Bochum · Text 5 – Parteien", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 5", "text": "In einer politischen Partei kommen Menschen mit gemeinsamen politischen Ansichten zusammen. Sie {kön|nen} das {Prog|ramm} ihrer {Par|tei} beeinflussen. {D|ie} Bürger {ei|nes} Staates {best|immen} in {fre|ien} Wahlen, {wel|che} Partei {d|ie} Regierung {bil|den} soll. {D|ie} Wahlen {si|nd} frei {u|nd} geheim. {S|o} darf {nie|mand} gezwungen {wer|den}, bestimmte {Poli|tiker} oder {Part|eien} zu {wäh|len} und {z|u} sagen, {w|en} er {gew|ählt} hat. {Na|ch} einigen {Jah|ren} gibt {e|s} wieder Wahlen, denn zu einem demokratischen Staat gehört der Regierungswechsel."}, {"id": "bo-t6", "title": "Bochum · Text 6 – Energie", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 6", "text": "Energie tritt in verschiedenen Formen auf, und sie hat von Anfang an die Geschichte des Menschen beeinflusst. Alles, {w|as} ein {Men|sch} tut, {d|ie} kleinste {Bewe|gung} wie {au|ch} die {grö|ßte} Anstrengung, {bra|ucht} Energie. {D|ie} menschliche {Kul|tur} von {ih|ren} Anfängen {b|is} heute {ka|nn} man {a|ls} eine {Gesch|ichte} immer {stär|kerer}, komplizierterer {Energien|utzung} betrachten. {Zue|rst} hatte {m|an} nur {Muskelk|raft} zur {Verf|ügung}. Schon {fr|üh} benutzten {Mens|chen} auch {Fe|uer}, um {Spe|isen} zu {koc|hen}. Aber es dauerte Jahrtausende, bis Wärmekraftmaschinen erfunden wurden."}, {"id": "da-t1", "title": "Darmstadt · Text 1 – Urlaubsreise", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 1", "text": "Bei der Planung von Urlaubsreisen ins Ausland sollte man bedenken: Nur {d|as} mitnehmen, {w|as} man {wirk|lich} braucht! {Da|zu} gehören {i|n} jedem {Fa|ll} die {Reisedoku|mente}, ein {gu|ter} Reiseführer {u|nd} ein {Wörter|buch}, die {Ti|ckets} sowie {ei|ne} Adressenliste. {We|lche} Kleidung {m|an} einpackt, {hä|ngt} vom {Zi|el} ab. {W|er} alleine {unte|rwegs} ist, {br|aucht} für {Notf|älle} eine {kle|ine} Reiseapotheke. {Obw|ohl} man {Ge|ld} fast {übe|rall} einfach {wech|seln} oder {abh|eben} kann, {empf|iehlt} es {si|ch}, eine {kle|ine} Summe {sc|hon} vor {d|er} Reise {umzuta|uschen}: Und {schli|eßlich} gehört {no|ch} etwas {i|m} Gepäck: Der eigene Hausschlüssel."}, {"id": "da-t2", "title": "Darmstadt · Text 2 – Einstein", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 2", "text": "Lange lebte die Familie Einstein in einer Mietwohnung in Berlin. Im Frühjahr 1929 {pl|ante} Albert Einstein {d|en} Bau {ei|nes} eigenen {Hau|ses}. Die {Fam|ilie} hatte {zw|ar} nur {we|nig} Geld, {ab|er} Einsteins {Tra|um} war {e|in} kleines {Ha|us} im {Grü|nen}, wo {e|r} in {Ru|he} nachdenken {kon|nte}. Als {e|s} dann {m|it} der {Pl|anung} endlich {sow|eit} war, {kontro|llierte} Einstein {d|ie} statischen {Berech|nungen} des {gepl|anten} Baus, {k|am} aber {z|u} anderen {Ergeb|nissen} als {vor|her} der {Arch|itekt}. Einsteins {Ass|istent} überprüfte {al|les} noch {ein|mal}. Zu {sei|ner} großen {Überra|schung} aber {mus|ste} er etwas {fests|tellen}: Der berühmte Physiker hatte sich beim Multiplizieren vertan."}, {"id": "da-t3", "title": "Darmstadt · Text 3 – Moung Yin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 3", "text": "Moung Yin stammt aus Taiwan. Sie {le|bt} aber {sc|hon} lange {i|n} Deutschland. Sie {erz|ählt}: “Wenn {me|ine} Familie {a|us} Taiwan {z|u} Besuch {ko|mmt}, merke {i|ch} immer, {w|ie} sehr {w|ir} uns {hi|er} schon {angep|asst} haben. {Me|in} Vater {z|um} Beispiel {ka|nn} es {überh|aupt} nicht {vers|tehen}, dass {me|in} Mann {sc|hon} seit {üb|er} zehn {Jah|ren} bei {derse|lben} großen {Fi|rma} arbeitet. {E|r} hat {au|ch} kein {Verst|ändnis} dafür, {da|ss} wir {ge|rn} in {Url|aub} fahren, {we|nn} wir {e|in} {Bedür|fnis} nach {Ru|he} und {Erho|lung} haben. Im Vergleich zu Asien wird in Deutschland sehr wenig gearbeitet.”"}, {"id": "da-t4", "title": "Darmstadt · Text 4 – Märchenerzählerin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 4", "text": "Eine Märchenerzählerin sitzt auf gleicher Höhe mit ihrem Publikum. Dieses {sit|zt} direkt {u|m} sie {he|rum}. Ihre {Au|gen} suchen {im|mer} wieder {d|en} Blickkontakt {m|it} einzelnen {Pers|onen} als {o|b} sie {ei|ne} Antwort {erwa|rten} würde. {Ih|re} Körperhaltung {i|st} zuerst {völ|lig} entspannt, {da|nn} wieder {dyna|misch} angespannt. {Ih|re} Hände {si|nd} immer {i|n} Bewegung: {Ges|ten} laden {al|le} zum {Mitd|enken} und {Fra|gen} ein, {verdeu|tlichen} die {Fig|uren}, zeigen {au|ch}, wie {gr|oß} oder {kl|ein} die {Zuh|örer} sich {et|was} vorstellen {sol|len}. Das {wicht|igste} Requisit {ble|ibt} aber {oh|ne} Zweifel {ih|re} Stimme. Mit dieser verzaubert sie ihre Zuhörer."}, {"id": "t-bo-g1", "cat": "task", "title": "Grammatik · Präpositionen & Endungen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 1", "text": "Edwin Land wurde {|am} 7. Mai 1909 in Bridgetown an der Ostküste Nordamerika{|s} geboren. {|Mit} 17 Jahren nahm er {|an} der Aufnahmeprüfung für d{|ie} berühmte Harvard-Universität teil. Er gehörte {|zu} den besten Kandidaten und bekam ein{|en} Studienplatz. Aber schon {|nach} ein paar Monaten brach der hochbegabt{|e} Mann sein Studium ab, zog in d{|ie} Millionenstadt New York, wohnte dort in ein{|er} Kellerwohnung und arbeitete an ungelöst{|en} Problemen d{|er} Physik. Erst Jahre später kehrte er {|an} die Harvard-Universität zurück."}, {"id": "t-bo-g2", "cat": "task", "title": "Grammatik · Konjunktionen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 2", "text": "Die Harvard-Universität stellte dem hochbegabten Edwin Land ein eigenes Labor zur Verfügung, {|damit/so dass} er die besten Bedingungen für seine Forschung hatte. {|Nachdem} er einige interessante Erfindungen gemacht hatte, gründete Land eine eigene Firma, {|um} seine Ideen vermarkten zu können. Er verließ die Universität, {|denn} er wollte sich mit ganzer Kraft um seine Firma kümmern. {|Als} er 1943 am Geburtstag seiner Tochter viele Photos von dem dreijährigen Mädchen machte, fragte die Kleine, {|ob} sie die Bilder sofort sehen könne. Diese naive Frage des Kindes führte dazu, {|dass} der Vater eine geniale Idee entwickelte. {|Während} die Kinder im Garten spielten, dachte der Vater darüber nach, {|wie} er eine Sofortbildkamera konstruieren könnte. Noch {|bevor} der Tag zu Ende war, hatte er die Lösung. Seine Tochter Jennifer war sehr zufrieden, {|weil} sie in Zukunft ihre Geburtstagsbilder sofort ansehen konnte. {|Obwohl} Edwin Land durch seine nächste Erfindung 70 Millionen Dollar verlor, blieb er einer der reichsten Männer Amerikas."}, {"id": "t-ki-g", "cat": "task", "title": "Grammatik · Akkusativ oder Dativ", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 4.3", "text": "Der Zug fuhr {|in den} Bahnhof ein.\nSeit wann lebst du {|in der} Schweiz?\n{|Hinter dem} Tisch befindet sich eine Wand.\nSie zweifeln {|an der} Richtigkeit der Aussage.\nSie steigt jeden Abend um 18:00 Uhr {|in den} Bus.\nIch komme {|aus der} Kleinstadt.\n{|An die} Wand hänge ich ein großes Bild.\nDer Vogel landete {|auf dem} Dach.\nDarf ich {|hinter dem} Bahnhof parken?"}, {"id": "t-ki-w1", "cat": "task", "title": "Wortschatz · Wortfamilien", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.1", "text": "hoch – Komparativ: {|höher} · Nomen: {|die Höhe}\nwarm – Komparativ: {|wärmer} · Nomen: {|die Wärme}\ntrocken – Komparativ: {|trockener} · Nomen: {|die Trockenheit}\nfrisch – Komparativ: {|frischer} · Nomen: {|die Frische}\nleicht – Komparativ: {|leichter} · Nomen: {|die Leichtigkeit}\nhart – Komparativ: {|härter} · Nomen: {|die Härte}"}, {"id": "t-ki-w2", "cat": "task", "title": "Wortschatz · Synonyme", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.2", "text": "reich – {|wohlhabend}\narm – {|mittellos}\ndirekt – {|unmittelbar}\ngeeignet – {|passend}\nhübsch – {|attraktiv}\nvollständig – {|komplett}\neinfach – {|leicht}\nkompliziert – {|komplex}"}, {"id": "wiki-t1", "title": "Wikipedia · Text 1 – Kaffee", "source": "Wikipedia (de) – Artikel „Kaffee“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Kaffee gehört zu den beliebtesten Getränken der Welt. Er {wi|rd} aus {d|en} gerösteten {Sam|en} der {Kaffeep|flanze} hergestellt, {d|ie} vor {all|em} in {tropi|schen} Ländern {w|ie} Brasilien {u|nd} Vietnam {wäc|hst}. Nach {d|er} Ernte {wer|den} die {Früc|hte} getrocknet, {gesc|hält} und {anschl|ießend} bei {hoh|en} Temperaturen {gerö|stet}. Dabei {entst|ehen} erst {d|ie} typischen {Aro|men}. In Deutschland trinkt jeder Einwohner im Durchschnitt mehr als 150 Liter Kaffee pro Jahr."}, {"id": "wiki-t2", "title": "Wikipedia · Text 2 – Fahrrad", "source": "Wikipedia (de) – Artikel „Fahrrad“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Fahrrad ist eines der wichtigsten Verkehrsmittel für kurze Strecken. Der {ers|te} Vorläufer {wur|de} von {d|em} Mannheimer {Ka|rl} Drais {erfu|nden} und {hat|te} noch {kei|ne} Pedale. {M|an} schob {si|ch} mit {d|en} Füßen {v|om} Boden {a|b}. Erst {Jahrz|ehnte} später {wur|den} Kurbeln {a|m} Vorderrad {angeb|racht}, wodurch {d|as} Fahren {deut|lich} bequemer {u|nd} schneller {wur|de}. Heute gibt es weltweit mehr als eine Milliarde Fahrräder."}, {"id": "wiki-t3", "title": "Wikipedia · Text 3 – Rhein", "source": "Wikipedia (de) – Artikel „Rhein“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Rhein zählt zu den längsten und wichtigsten Flüssen Europas. Er {entsp|ringt} in {d|en} Schweizer {Alp|en} und {fli|eßt} durch {mehr|ere} Länder, {bev|or} er {i|n} den {Nieder|landen} in {d|ie} Nordsee {mün|det}. Besonders {beka|nnt} ist {d|as} Obere {Mittelr|heintal} mit {sei|nen} steilen {Weinb|ergen} und {vie|len} Burgen. {D|er} Fluss {die|nt} außerdem {a|ls} bedeutende {Wasser|straße} für den Güterverkehr. Das Mittelrheintal gehört zum UNESCO-Welterbe."}, {"id": "wiki-t4", "title": "Wikipedia · Text 4 – Buchdruck", "source": "Wikipedia (de) – Artikel „Buchdruck“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Buchdruck mit beweglichen Lettern veränderte Europa grundlegend. Mitte {d|es} fünfzehnten {Jahrhu|nderts} entwickelte {Joha|nnes} Gutenberg {i|n} Mainz {e|in} Verfahren, {b|ei} dem {einz|elne} Buchstaben {a|us} Metall {gego|ssen} wurden. {Die|se} Lettern {kon|nte} man {beli|ebig} zusammensetzen {u|nd} immer {wie|der} verwenden. {Dadu|rch} wurden {Büc|her} viel {bill|iger} und {f|ür} breitere {Schic|hten} erschwinglich. So verbreiteten sich neue Ideen schneller als je zuvor."}, {"id": "wiki-t5", "title": "Wikipedia · Text 5 – Mond", "source": "Wikipedia (de) – Artikel „Mond“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Mond ist der einzige natürliche Satellit der Erde. Er {umkr|eist} unseren {Plan|eten} in {kna|pp} vier {Woc|hen} und {zei|gt} uns {dab|ei} immer {dies|elbe} Seite. {We|il} er {sel|bst} nicht {leuc|htet}, reflektiert {e|r} nur {d|as} Licht {d|er} Sonne. {D|ie} wechselnden {Mondp|hasen} entstehen {dadu|rch}, dass {w|ir} den {beleuc|hteten} Teil {a|us} unterschiedlichen {Wink|eln} sehen. Im Jahr 1969 betraten erstmals Menschen seine Oberfläche."}, {"id": "wiki-t6", "title": "Wikipedia · Text 6 – Honigbiene", "source": "Wikipedia (de) – Artikel „Westliche Honigbiene“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Honigbiene ist ein wichtiges Nutztier des Menschen. Sie {le|bt} in {gro|ßen} Völkern, {d|ie} aus {ein|er} Königin, {eini|gen} hundert {Droh|nen} und {vie|len} tausend {Arbeite|rinnen} bestehen. {D|ie} Arbeiterinnen {samm|eln} Nektar {u|nd} Pollen, {bau|en} Waben {u|nd} versorgen {d|ie} Brut. {Auße|rdem} bestäuben {s|ie} zahlreiche {Blü|ten}, wodurch {d|ie} Ernte {v|on} Obst {u|nd} Gemüse gesichert wird. Deshalb gilt ihr Rückgang als ernstes Problem für die Landwirtschaft."}, {"id": "wiki-t7", "title": "Wikipedia · Text 7 – Alpen", "source": "Wikipedia (de) – Artikel „Alpen“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Alpen erstrecken sich über acht Länder in Mitteleuropa. Der {höch|ste} Berg {i|st} der {Mo|nt} Blanc {a|n} der {Gre|nze} zwischen {Frank|reich} und {Ital|ien}. Das {Gebi|rge} entstand, {a|ls} die {afrika|nische} und {d|ie} eurasische {Pla|tte} zusammenstießen. {Heu|te} kommen {jed|es} Jahr {Milli|onen} Touristen {z|um} Wandern {u|nd} Skifahren {i|n} die {Reg|ion}. Dadurch ist der Tourismus für viele Alpentäler die wichtigste Einnahmequelle."}, {"id": "wiki-t8", "title": "Wikipedia · Text 8 – Schokolade", "source": "Wikipedia (de) – Artikel „Schokolade“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Schokolade wird aus den Samen des Kakaobaums hergestellt. Der {Ba|um} wächst {n|ur} in {d|er} Nähe {d|es} Äquators, {v|or} allem {i|n} Westafrika {u|nd} Südamerika. {D|ie} Kakaobohnen {wer|den} fermentiert, {getro|cknet} und {anschl|ießend} zu {ein|er} Masse {gema|hlen}. Für {Milchsch|okolade} mischt {m|an} diese {Mas|se} mit {Zuc|ker} und {Milchp|ulver}. Danach {wi|rd} sie {gewa|lzt}, erhitzt und in Form gebracht. Schon die Azteken tranken Kakao als bitteres Getränk."}, {"id": "wiki-t9", "title": "Wikipedia · Text 9 – Eisbär", "source": "Wikipedia (de) – Artikel „Eisbär“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Eisbär ist das größte an Land lebende Raubtier der Erde. Er {le|bt} in {d|er} Arktis {u|nd} jagt {hauptsä|chlich} Robben, {d|ie} er {a|n} Atemlöchern {i|m} Eis {erwa|rtet}. Sein {dich|tes} Fell {u|nd} eine {dic|ke} Fettschicht {schü|tzen} ihn {v|or} der {extr|emen} Kälte. {We|il} das {Meer|eis} durch {d|ie} Erderwärmung {imm|er} früher {schm|ilzt}, hat {e|r} weniger Zeit für die Jagd. Deshalb gilt die Art als gefährdet."}, {"id": "wiki-t10", "title": "Wikipedia · Text 10 – Internet", "source": "Wikipedia (de) – Artikel „Internet“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Internet verbindet heute Milliarden von Geräten auf der ganzen Welt. Seine {Urspr|ünge} liegen {i|n} einem {amerika|nischen} Forschungsnetz, {m|it} dem {Univers|itäten} Daten {austau|schen} konnten. {Spä|ter} entwickelte {T|im} Berners-Lee {a|m} Forschungszentrum {CE|RN} die {Grund|lagen} des {Wor|ld} Wide {W|eb}. Dadurch {konn|ten} auch {Lai|en} Seiten {aufr|ufen} und {mitein|ander} verknüpfen. {Inzwi|schen} nutzen {e|s} Menschen {fa|st} überall zum Lernen und Arbeiten. Ohne diese Entwicklung wäre unser Alltag kaum vorstellbar."}, {"id": "wiki-t11", "title": "Wikipedia · Text 11 – Wasser", "source": "Wikipedia (de) – Artikel „Wasser“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Wasser ist die Grundlage allen Lebens auf der Erde. Rund {sieb|zig} Prozent {d|er} Erdoberfläche {si|nd} von {Was|ser} bedeckt, {do|ch} nur {e|in} kleiner {Te|il} dav app.innerHTML=`<h1>⚡ Blitz</h1><div class="card"><p class="mut">10 quick items. Each starts with an intact sentence for context, then a few gaps. The clock is short: <b>Space / Enter</b> jumps to the next gap, Enter in the last gap submits. Timeout submits automatically.</p><div class="lab" style="padding-left:0">Focus</div><div class="tabs">${m.map(([k,l])=>`<button class="${bmode===k?'on':''}" onclick="bmode='${k}';R.blitz()">${l}</button>`).join('')}</div>${bmode==='a'||bmode==='mix'?`<label style="display:flex;gap:8px;align-items:center;margin:10px 0;cursor:pointer"><input type="checkbox" ${bapre?'checked':''} onchange="bapre=this.checked;R.blitz()"> Also gap the prepositions <span class="mut">(Adjektivendungen sentences: in, mit, wegen…)</span></label>`:''}${bmode==='p'?bPanel():''}<button onclick="bStart()">Start</button></div>`};
function bStart(){const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const q=sh(bmode==='p'?pItems():BLITZ.map((x,i)=>({i,k:x[0],t:x[0]==='a'&&bapre?apre(x[1]):x[1]})).filter(x=>bmode==='mix'||x.k===bmode)).slice(0,10);if(!q.length){alert('No sentences match this selection.');return}

function bNext(){if(!B)return;if(B.n>=B.q.length)return bEnd();

app.innerHTML=`<div class="bar"><div class="clock" id="bc">0</div><div class="mut">${B.n+1}/${B.q.length} · Score <b id="bs">${B.score}</b> · 🔥 ${B.streak}</div><button class="g" onclick="go('blitz')">Quit</button></div><div class="card"><div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px"><div id="bb" style="height:100%;width:100%;background:var(--acc)"></div></div><div class="txt" id="bt">${tok.map(x=>typeof x==='string'?esc(x):`<span class="gap" data-c="${esc(x.g+x.m)}">${esc(x.g)}<input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span>`).join('')}</div><div id="br" style="margin-top:10px"></div></div>`;
const ins=[...document.querySelectorAll('#bt .gap input')];
ins.forEach((el,i)=>{el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ins[i+1]?ins[i+1].focus():bSubmit()}else if(e.key===' '||e.key==='ArrowRight'){if(ins[i+1]){e.preventDefault();ins[i+1].focus()}}else if(e.key==='Backspace'&&!el.value&&ins[i-1]){e.preventDefault();ins[i-1].focus()}else if(e.key==='ArrowLeft'&&ins[i-1]&&el.selectionStart===0)ins[i-1].focus()}});
