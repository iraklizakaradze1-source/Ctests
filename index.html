WHO hat positive Auswirkungen von Rauchverboten, Warnhinweisen auf Zigarettenschachteln und Abgaben für Tabak nachgewiesen: {Üb|er} sieben {Mill|ionen} Menschen {hät|ten} dadurch {v|or} einem {frühze|itigen} Tod {bewa|hrt} werden {kön|nen}. Dass {staat|liche} Maßnahmen {ge|gen} das {risk|ante} Rauchen {z|u} einem {s|o} guten {Resu|ltat} führen {wür|den}, sei {ka|um} vorhersehbar {gew|esen}. Man {empf|iehlt} daher, {d|ie} Tabaksteuer {schrit|tweise} zu {erh|öhen}, um {me|hr} Menschen {a|ls} bisher {v|om} Rauchen {abzuh|alten}. Viele {Jugen|dliche} würden schon jetzt ihr Geld lieber für ein Smartphone sparen. Das ist sicher sinnvoller als zu qualmen."}, {"id": "mun2-t2", "title": "München 2 · Text 2 – Zimmersuche", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 2", "text": "Die Würzburger Studentin Kristina Helmreich erfand im Jahr 2012 das sogenannte Speed-Dating bei der Zimmersuche: „Meine {eig|ene} Suche {na|ch} einer {Wohngeme|inschaft} hatte {mi|ch} unglaublich {vi|el} Mühe {geko|stet}. Deshalb {besc|hloss} ich, {regel|mäßig} ein {zeitsp|arendes}, unkompliziertes {Tre|ffen} für {intere|ssierte} Zimmersuchende {u|nd} Zimmeranbieter {z|u} organisieren. {Fü|nf} Minuten {müs|sen} jeweils {ausre|ichen}, um {herausz|ufinden}, ob {si|ch} die {bei|den} Gesprächspartner {über|haupt} ein {Le|ben} in {ei|ner} gemeinsamen {Woh|nung} vorstellen {kön|nen}. Nur {da|nn} gibt es einen Besichtigungstermin und im Idealfall auch einen Mietvertrag.“ Ein Erfolgsprojekt, wie ihre „Kunden“ meinen!"}, {"id": "mun2-t3", "title": "München 2 · Text 3 – Buchstabengröße", "source": "Studienkolleg Bayern – Beispiel Testteil A.1 (Stand Mai 2015), Muster C-Test 2, Text 3", "text": "Neurowissenschaftler haben mit Hirnmessungen herausgefunden, wie uns die Größe von Buchstaben beeinflusst. {S|ie} dient {ni|cht} nur {d|er} Lenkung {uns|erer} Aufmerksamkeit. {I|st} etwas {i|n} besonders {gro|ßen} Buchstaben {gedr|uckt}, löst {e|s} auch {stär|kere} Emotionen {a|us}. Dabei {st|eht} jedoch {d|er} Inhalt {des|sen}, was {m|an} gerade {li|est}, überraschenderweise {er|st} an {zwe|iter} Stelle. {Oh|ne} Zweifel {wei|sen} diese {mess|baren} Gefühlsreaktionen {a|uf} die {eno|rme} Bedeutung {v|on} Schrift {i|n} alphabetisierten Gesellschaften hin. Testen Sie sich selbst, wenn Sie das nächste Mal ein Werbeplakat sehen."}, {"id": "bo-t1", "title": "Bochum · Text 1 – Berufsverkehr", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 1", "text": "Jeden Morgen müssen viele Leute pünktlich am Arbeitsplatz sein. Dazu {fah|ren} sie {entw|eder} mit {d|em} eigenen {Au|to} oder {s|ie} benutzen {öffen|tliche} Verkehrsmittel {w|ie} z.B. {Ba|hn}, Bus {od|er} Straßenbahn. {Ein|ige} fahren {m|it} dem {Fahrr|ad}. In {al|len} Fällen {si|nd} die {Str|aßen} zu {d|en} Hauptverkehrszeiten {verst|opft}; denn {im|mer} mehr {Mens|chen} wohnen {he|ute} nicht {me|hr} in {d|er} Innenstadt. {S|ie} leben {i|n} Vororten; {de|nn} da ist das Wohnen angenehmer. So nimmt die Zahl der Berufstätigen, die täglich hin und her fahren, weiter zu."}, {"id": "bo-t2", "title": "Bochum · Text 2 – Herr Peters", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 2", "text": "Herr Peters will seinen Sohn Robert vom Flughafen abholen. Robert {ha|t} in {d|er} Türkei {Url|aub} gemacht; {e|r} will {he|ute} Nachmittag {m|it} dem {Flugz|eug} zurückkommen. {Se|in} Vater {ste|igt} ins {Au|to} und {wi|ll} gerade {abfa|hren}, als {Fr|au} Peters {ru|ft}: „Bleib {hi|er}! Robert {ha|t} eben {m|it} mir {telef|oniert}, leider {h|at} er {kei|nen} Platz {me|hr} in {d|er} Maschine {beko|mmen} und {ka|nn} erst {mor|gen} kommen.“ Herr Peters steigt aus und geht wieder ins Haus."}, {"id": "bo-t3", "title": "Bochum · Text 3 – Frau Müller", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 3", "text": "Frau Müller erzählt ihrem Mann beim Mittagessen, was sie am Morgen erledigt hat: „Ich {b|in} zur {Spark|asse} gefahren, {ha|be} die {Mi|ete}, die {Telefonr|echnung} und {d|ie} Fernsehgebühren {bez|ahlt}. Ich {ha|be} auch 200 € {v|on} unserem {Ko|nto} abgehoben. {Dan|ach} bin {i|ch} zur {Po|st} gelaufen, {ha|be} dort {Postk|arten} gekauft {u|nd} das {Pa|ket} an {uns|ere} Tochter {abges|chickt}. Eben {b|in} ich {no|ch} bei {d|er} Stadtverwaltung {gew|esen}, um {m|ir} einen {Pa|ss} ausstellen zu lassen. Du siehst also: Ich war ununterbrochen unterwegs.“"}, {"id": "bo-t4", "title": "Bochum · Text 4 – Arbeitstag", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 4", "text": "Die Deutschen haben in der Regel einen Arbeitstag von etwa acht Stunden. Sie {arbe|iten} an {fü|nf} Tagen {i|n} der {Wo|che} und {mac|hen} mehrere {Woc|hen} im {Ja|hr} Urlaub. {E|in} Arbeitnehmer {h|at} normalerweise {dreiß|ig} Arbeitstage {jähr|lich} frei. {M|it} den {Wochene|nden} kann {m|an} auf {ei|ne} Urlaubsdauer {v|on} sechs {Woc|hen} kommen. {D|ie} Durchschnittszahlen {gel|ten} zwar {ni|cht} für {je|den} Erwerbstätigen {u|nd} für {je|den} Beruf, {ab|er} sie {ge|ben} doch den Berufsalltag vieler Menschen in Deutschland recht genau wieder."}, {"id": "bo-t5", "title": "Bochum · Text 5 – Parteien", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 5", "text": "In einer politischen Partei kommen Menschen mit gemeinsamen politischen Ansichten zusammen. Sie {kön|nen} das {Prog|ramm} ihrer {Par|tei} beeinflussen. {D|ie} Bürger {ei|nes} Staates {best|immen} in {fre|ien} Wahlen, {wel|che} Partei {d|ie} Regierung {bil|den} soll. {D|ie} Wahlen {si|nd} frei {u|nd} geheim. {S|o} darf {nie|mand} gezwungen {wer|den}, bestimmte {Poli|tiker} oder {Part|eien} zu {wäh|len} und {z|u} sagen, {w|en} er {gew|ählt} hat. {Na|ch} einigen {Jah|ren} gibt {e|s} wieder Wahlen, denn zu einem demokratischen Staat gehört der Regierungswechsel."}, {"id": "bo-t6", "title": "Bochum · Text 6 – Energie", "source": "Studienkolleg Bochum – Die sprachliche Aufnahmeprüfung (10/2008), Text 6", "text": "Energie tritt in verschiedenen Formen auf, und sie hat von Anfang an die Geschichte des Menschen beeinflusst. Alles, {w|as} ein {Men|sch} tut, {d|ie} kleinste {Bewe|gung} wie {au|ch} die {grö|ßte} Anstrengung, {bra|ucht} Energie. {D|ie} menschliche {Kul|tur} von {ih|ren} Anfängen {b|is} heute {ka|nn} man {a|ls} eine {Gesch|ichte} immer {stär|kerer}, komplizierterer {Energien|utzung} betrachten. {Zue|rst} hatte {m|an} nur {Muskelk|raft} zur {Verf|ügung}. Schon {fr|üh} benutzten {Mens|chen} auch {Fe|uer}, um {Spe|isen} zu {koc|hen}. Aber es dauerte Jahrtausende, bis Wärmekraftmaschinen erfunden wurden."}, {"id": "da-t1", "title": "Darmstadt · Text 1 – Urlaubsreise", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 1", "text": "Bei der Planung von Urlaubsreisen ins Ausland sollte man bedenken: Nur {d|as} mitnehmen, {w|as} man {wirk|lich} braucht! {Da|zu} gehören {i|n} jedem {Fa|ll} die {Reisedoku|mente}, ein {gu|ter} Reiseführer {u|nd} ein {Wörter|buch}, die {Ti|ckets} sowie {ei|ne} Adressenliste. {We|lche} Kleidung {m|an} einpackt, {hä|ngt} vom {Zi|el} ab. {W|er} alleine {unte|rwegs} ist, {br|aucht} für {Notf|älle} eine {kle|ine} Reiseapotheke. {Obw|ohl} man {Ge|ld} fast {übe|rall} einfach {wech|seln} oder {abh|eben} kann, {empf|iehlt} es {si|ch}, eine {kle|ine} Summe {sc|hon} vor {d|er} Reise {umzuta|uschen}: Und {schli|eßlich} gehört {no|ch} etwas {i|m} Gepäck: Der eigene Hausschlüssel."}, {"id": "da-t2", "title": "Darmstadt · Text 2 – Einstein", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 2", "text": "Lange lebte die Familie Einstein in einer Mietwohnung in Berlin. Im Frühjahr 1929 {pl|ante} Albert Einstein {d|en} Bau {ei|nes} eigenen {Hau|ses}. Die {Fam|ilie} hatte {zw|ar} nur {we|nig} Geld, {ab|er} Einsteins {Tra|um} war {e|in} kleines {Ha|us} im {Grü|nen}, wo {e|r} in {Ru|he} nachdenken {kon|nte}. Als {e|s} dann {m|it} der {Pl|anung} endlich {sow|eit} war, {kontro|llierte} Einstein {d|ie} statischen {Berech|nungen} des {gepl|anten} Baus, {k|am} aber {z|u} anderen {Ergeb|nissen} als {vor|her} der {Arch|itekt}. Einsteins {Ass|istent} überprüfte {al|les} noch {ein|mal}. Zu {sei|ner} großen {Überra|schung} aber {mus|ste} er etwas {fests|tellen}: Der berühmte Physiker hatte sich beim Multiplizieren vertan."}, {"id": "da-t3", "title": "Darmstadt · Text 3 – Moung Yin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 3", "text": "Moung Yin stammt aus Taiwan. Sie {le|bt} aber {sc|hon} lange {i|n} Deutschland. Sie {erz|ählt}: “Wenn {me|ine} Familie {a|us} Taiwan {z|u} Besuch {ko|mmt}, merke {i|ch} immer, {w|ie} sehr {w|ir} uns {hi|er} schon {angep|asst} haben. {Me|in} Vater {z|um} Beispiel {ka|nn} es {überh|aupt} nicht {vers|tehen}, dass {me|in} Mann {sc|hon} seit {üb|er} zehn {Jah|ren} bei {derse|lben} großen {Fi|rma} arbeitet. {E|r} hat {au|ch} kein {Verst|ändnis} dafür, {da|ss} wir {ge|rn} in {Url|aub} fahren, {we|nn} wir {e|in} {Bedür|fnis} nach {Ru|he} und {Erho|lung} haben. Im Vergleich zu Asien wird in Deutschland sehr wenig gearbeitet.”"}, {"id": "da-t4", "title": "Darmstadt · Text 4 – Märchenerzählerin", "source": "Internationales Studienkolleg TU Darmstadt – Beispiel für einen Deutsch-Aufnahmetest, Text 4", "text": "Eine Märchenerzählerin sitzt auf gleicher Höhe mit ihrem Publikum. Dieses {sit|zt} direkt {u|m} sie {he|rum}. Ihre {Au|gen} suchen {im|mer} wieder {d|en} Blickkontakt {m|it} einzelnen {Pers|onen} als {o|b} sie {ei|ne} Antwort {erwa|rten} würde. {Ih|re} Körperhaltung {i|st} zuerst {völ|lig} entspannt, {da|nn} wieder {dyna|misch} angespannt. {Ih|re} Hände {si|nd} immer {i|n} Bewegung: {Ges|ten} laden {al|le} zum {Mitd|enken} und {Fra|gen} ein, {verdeu|tlichen} die {Fig|uren}, zeigen {au|ch}, wie {gr|oß} oder {kl|ein} die {Zuh|örer} sich {et|was} vorstellen {sol|len}. Das {wicht|igste} Requisit {ble|ibt} aber {oh|ne} Zweifel {ih|re} Stimme. Mit dieser verzaubert sie ihre Zuhörer."}, {"id": "t-bo-g1", "cat": "task", "title": "Grammatik · Präpositionen & Endungen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 1", "text": "Edwin Land wurde {|am} 7. Mai 1909 in Bridgetown an der Ostküste Nordamerika{|s} geboren. {|Mit} 17 Jahren nahm er {|an} der Aufnahmeprüfung für d{|ie} berühmte Harvard-Universität teil. Er gehörte {|zu} den besten Kandidaten und bekam ein{|en} Studienplatz. Aber schon {|nach} ein paar Monaten brach der hochbegabt{|e} Mann sein Studium ab, zog in d{|ie} Millionenstadt New York, wohnte dort in ein{|er} Kellerwohnung und arbeitete an ungelöst{|en} Problemen d{|er} Physik. Erst Jahre später kehrte er {|an} die Harvard-Universität zurück."}, {"id": "t-bo-g2", "cat": "task", "title": "Grammatik · Konjunktionen", "source": "Studienkolleg Bochum – Prüfungsbeispiel Grammatik, Aufgabe 2", "text": "Die Harvard-Universität stellte dem hochbegabten Edwin Land ein eigenes Labor zur Verfügung, {|damit/so dass} er die besten Bedingungen für seine Forschung hatte. {|Nachdem} er einige interessante Erfindungen gemacht hatte, gründete Land eine eigene Firma, {|um} seine Ideen vermarkten zu können. Er verließ die Universität, {|denn} er wollte sich mit ganzer Kraft um seine Firma kümmern. {|Als} er 1943 am Geburtstag seiner Tochter viele Photos von dem dreijährigen Mädchen machte, fragte die Kleine, {|ob} sie die Bilder sofort sehen könne. Diese naive Frage des Kindes führte dazu, {|dass} der Vater eine geniale Idee entwickelte. {|Während} die Kinder im Garten spielten, dachte der Vater darüber nach, {|wie} er eine Sofortbildkamera konstruieren könnte. Noch {|bevor} der Tag zu Ende war, hatte er die Lösung. Seine Tochter Jennifer war sehr zufrieden, {|weil} sie in Zukunft ihre Geburtstagsbilder sofort ansehen konnte. {|Obwohl} Edwin Land durch seine nächste Erfindung 70 Millionen Dollar verlor, blieb er einer der reichsten Männer Amerikas."}, {"id": "t-ki-g", "cat": "task", "title": "Grammatik · Akkusativ oder Dativ", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 4.3", "text": "Der Zug fuhr {|in den} Bahnhof ein.\nSeit wann lebst du {|in der} Schweiz?\n{|Hinter dem} Tisch befindet sich eine Wand.\nSie zweifeln {|an der} Richtigkeit der Aussage.\nSie steigt jeden Abend um 18:00 Uhr {|in den} Bus.\nIch komme {|aus der} Kleinstadt.\n{|An die} Wand hänge ich ein großes Bild.\nDer Vogel landete {|auf dem} Dach.\nDarf ich {|hinter dem} Bahnhof parken?"}, {"id": "t-ki-w1", "cat": "task", "title": "Wortschatz · Wortfamilien", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.1", "text": "hoch – Komparativ: {|höher} · Nomen: {|die Höhe}\nwarm – Komparativ: {|wärmer} · Nomen: {|die Wärme}\ntrocken – Komparativ: {|trockener} · Nomen: {|die Trockenheit}\nfrisch – Komparativ: {|frischer} · Nomen: {|die Frische}\nleicht – Komparativ: {|leichter} · Nomen: {|die Leichtigkeit}\nhart – Komparativ: {|härter} · Nomen: {|die Härte}"}, {"id": "t-ki-w2", "cat": "task", "title": "Wortschatz · Synonyme", "source": "Studienkolleg Kiel – Aufnahmetest Deutsch, Aufgabe 3.2", "text": "reich – {|wohlhabend}\narm – {|mittellos}\ndirekt – {|unmittelbar}\ngeeignet – {|passend}\nhübsch – {|attraktiv}\nvollständig – {|komplett}\neinfach – {|leicht}\nkompliziert – {|komplex}"}, {"id": "wiki-t1", "title": "Wikipedia · Text 1 – Kaffee", "source": "Wikipedia (de) – Artikel „Kaffee“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Kaffee gehört zu den beliebtesten Getränken der Welt. Er {wi|rd} aus {d|en} gerösteten {Sam|en} der {Kaffeep|flanze} hergestellt, {d|ie} vor {all|em} in {tropi|schen} Ländern {w|ie} Brasilien {u|nd} Vietnam {wäc|hst}. Nach {d|er} Ernte {wer|den} die {Früc|hte} getrocknet, {gesc|hält} und {anschl|ießend} bei {hoh|en} Temperaturen {gerö|stet}. Dabei {entst|ehen} erst {d|ie} typischen {Aro|men}. In Deutschland trinkt jeder Einwohner im Durchschnitt mehr als 150 Liter Kaffee pro Jahr."}, {"id": "wiki-t2", "title": "Wikipedia · Text 2 – Fahrrad", "source": "Wikipedia (de) – Artikel „Fahrrad“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Fahrrad ist eines der wichtigsten Verkehrsmittel für kurze Strecken. Der {ers|te} Vorläufer {wur|de} von {d|em} Mannheimer {Ka|rl} Drais {erfu|nden} und {hat|te} noch {kei|ne} Pedale. {M|an} schob {si|ch} mit {d|en} Füßen {v|om} Boden {a|b}. Erst {Jahrz|ehnte} später {wur|den} Kurbeln {a|m} Vorderrad {angeb|racht}, wodurch {d|as} Fahren {deut|lich} bequemer {u|nd} schneller {wur|de}. Heute gibt es weltweit mehr als eine Milliarde Fahrräder."}, {"id": "wiki-t3", "title": "Wikipedia · Text 3 – Rhein", "source": "Wikipedia (de) – Artikel „Rhein“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Rhein zählt zu den längsten und wichtigsten Flüssen Europas. Er {entsp|ringt} in {d|en} Schweizer {Alp|en} und {fli|eßt} durch {mehr|ere} Länder, {bev|or} er {i|n} den {Nieder|landen} in {d|ie} Nordsee {mün|det}. Besonders {beka|nnt} ist {d|as} Obere {Mittelr|heintal} mit {sei|nen} steilen {Weinb|ergen} und {vie|len} Burgen. {D|er} Fluss {die|nt} außerdem {a|ls} bedeutende {Wasser|straße} für den Güterverkehr. Das Mittelrheintal gehört zum UNESCO-Welterbe."}, {"id": "wiki-t4", "title": "Wikipedia · Text 4 – Buchdruck", "source": "Wikipedia (de) – Artikel „Buchdruck“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Buchdruck mit beweglichen Lettern veränderte Europa grundlegend. Mitte {d|es} fünfzehnten {Jahrhu|nderts} entwickelte {Joha|nnes} Gutenberg {i|n} Mainz {e|in} Verfahren, {b|ei} dem {einz|elne} Buchstaben {a|us} Metall {gego|ssen} wurden. {Die|se} Lettern {kon|nte} man {beli|ebig} zusammensetzen {u|nd} immer {wie|der} verwenden. {Dadu|rch} wurden {Büc|her} viel {bill|iger} und {f|ür} breitere {Schic|hten} erschwinglich. So verbreiteten sich neue Ideen schneller als je zuvor."}, {"id": "wiki-t5", "title": "Wikipedia · Text 5 – Mond", "source": "Wikipedia (de) – Artikel „Mond“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Mond ist der einzige natürliche Satellit der Erde. Er {umkr|eist} unseren {Plan|eten} in {kna|pp} vier {Woc|hen} und {zei|gt} uns {dab|ei} immer {dies|elbe} Seite. {We|il} er {sel|bst} nicht {leuc|htet}, reflektiert {e|r} nur {d|as} Licht {d|er} Sonne. {D|ie} wechselnden {Mondp|hasen} entstehen {dadu|rch}, dass {w|ir} den {beleuc|hteten} Teil {a|us} unterschiedlichen {Wink|eln} sehen. Im Jahr 1969 betraten erstmals Menschen seine Oberfläche."}, {"id": "wiki-t6", "title": "Wikipedia · Text 6 – Honigbiene", "source": "Wikipedia (de) – Artikel „Westliche Honigbiene“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Honigbiene ist ein wichtiges Nutztier des Menschen. Sie {le|bt} in {gro|ßen} Völkern, {d|ie} aus {ein|er} Königin, {eini|gen} hundert {Droh|nen} und {vie|len} tausend {Arbeite|rinnen} bestehen. {D|ie} Arbeiterinnen {samm|eln} Nektar {u|nd} Pollen, {bau|en} Waben {u|nd} versorgen {d|ie} Brut. {Auße|rdem} bestäuben {s|ie} zahlreiche {Blü|ten}, wodurch {d|ie} Ernte {v|on} Obst {u|nd} Gemüse gesichert wird. Deshalb gilt ihr Rückgang als ernstes Problem für die Landwirtschaft."}, {"id": "wiki-t7", "title": "Wikipedia · Text 7 – Alpen", "source": "Wikipedia (de) – Artikel „Alpen“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Alpen erstrecken sich über acht Länder in Mitteleuropa. Der {höch|ste} Berg {i|st} der {Mo|nt} Blanc {a|n} der {Gre|nze} zwischen {Frank|reich} und {Ital|ien}. Das {Gebi|rge} entstand, {a|ls} die {afrika|nische} und {d|ie} eurasische {Pla|tte} zusammenstießen. {Heu|te} kommen {jed|es} Jahr {Milli|onen} Touristen {z|um} Wandern {u|nd} Skifahren {i|n} die {Reg|ion}. Dadurch ist der Tourismus für viele Alpentäler die wichtigste Einnahmequelle."}, {"id": "wiki-t8", "title": "Wikipedia · Text 8 – Schokolade", "source": "Wikipedia (de) – Artikel „Schokolade“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Schokolade wird aus den Samen des Kakaobaums hergestellt. Der {Ba|um} wächst {n|ur} in {d|er} Nähe {d|es} Äquators, {v|or} allem {i|n} Westafrika {u|nd} Südamerika. {D|ie} Kakaobohnen {wer|den} fermentiert, {getro|cknet} und {anschl|ießend} zu {ein|er} Masse {gema|hlen}. Für {Milchsch|okolade} mischt {m|an} diese {Mas|se} mit {Zuc|ker} und {Milchp|ulver}. Danach {wi|rd} sie {gewa|lzt}, erhitzt und in Form gebracht. Schon die Azteken tranken Kakao als bitteres Getränk."}, {"id": "wiki-t9", "title": "Wikipedia · Text 9 – Eisbär", "source": "Wikipedia (de) – Artikel „Eisbär“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Der Eisbär ist das größte an Land lebende Raubtier der Erde. Er {le|bt} in {d|er} Arktis {u|nd} jagt {hauptsä|chlich} Robben, {d|ie} er {a|n} Atemlöchern {i|m} Eis {erwa|rtet}. Sein {dich|tes} Fell {u|nd} eine {dic|ke} Fettschicht {schü|tzen} ihn {v|or} der {extr|emen} Kälte. {We|il} das {Meer|eis} durch {d|ie} Erderwärmung {imm|er} früher {schm|ilzt}, hat {e|r} weniger Zeit für die Jagd. Deshalb gilt die Art als gefährdet."}, {"id": "wiki-t10", "title": "Wikipedia · Text 10 – Internet", "source": "Wikipedia (de) – Artikel „Internet“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Das Internet verbindet heute Milliarden von Geräten auf der ganzen Welt. Seine {Urspr|ünge} liegen {i|n} einem {amerika|nischen} Forschungsnetz, {m|it} dem {Univers|itäten} Daten {austau|schen} konnten. {Spä|ter} entwickelte {T|im} Berners-Lee {a|m} Forschungszentrum {CE|RN} die {Grund|lagen} des {Wor|ld} Wide {W|eb}. Dadurch {konn|ten} auch {Lai|en} Seiten {aufr|ufen} und {mitein|ander} verknüpfen. {Inzwi|schen} nutzen {e|s} Menschen {fa|st} überall zum Lernen und Arbeiten. Ohne diese Entwicklung wäre unser Alltag kaum vorstellbar."}, {"id": "wiki-t11", "title": "Wikipedia · Text 11 – Wasser", "source": "Wikipedia (de) – Artikel „Wasser“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Wasser ist die Grundlage allen Lebens auf der Erde. Rund {sieb|zig} Prozent {d|er} Erdoberfläche {si|nd} von {Was|ser} bedeckt, {do|ch} nur {e|in} kleiner {Te|il} davon {i|st} Süßwasser. {E|s} kommt {a|ls} Flüssigkeit, {a|ls} Eis {u|nd} als {Dam|pf} vor. {Dur|ch} Verdunstung, {Wolkenb|ildung} und {Reg|en} befindet {si|ch} das {Was|ser} in {ein|em} ständigen {Kreis|lauf}. Dieser Kreislauf sorgt dafür, dass es auf dem Land immer wieder frisches Wasser gibt. Ein erwachsener Mensch besteht zu mehr als der Hälfte aus Wasser."}, {"id": "wiki-t12", "title": "Wikipedia · Text 12 – Fußball", "source": "Wikipedia (de) – Artikel „Fußball“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Fußball ist die beliebteste Sportart der Welt. Zwei {Mannsc|haften} mit {jewe|ils} elf {Spie|lern} versuchen, {d|en} Ball {i|ns} gegnerische {T|or} zu {beför|dern}. Außer {d|em} Torwart {dür|fen} die {Spie|ler} den {Ba|ll} nicht {m|it} den {Hän|den} berühren. {E|in} Spiel {dau|ert} neunzig {Minu|ten} und {wi|rd} von {ein|em} Schiedsrichter {gele|itet}. Wenn {ei|ne} Mannschaft das Regelwerk verletzt, bekommt die andere einen Freistoß oder sogar einen Elfmeter zugesprochen. Die Weltmeisterschaft findet alle vier Jahre statt."}, {"id": "wiki-t13", "title": "Wikipedia · Text 13 – Vulkan", "source": "Wikipedia (de) – Artikel „Vulkan“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Ein Vulkan ist eine Stelle der Erdoberfläche, an der Magma austritt. Tief {i|m} Inneren {d|er} Erde {schm|ilzt} Gestein {dur|ch} die {ho|he} Hitze. {Die|ses} flüssige {Gest|ein} steigt {na|ch} oben, {we|il} es {leic|hter} ist {a|ls} seine {Umge|bung}. Bei {ein|em} Ausbruch {wer|den} Lava, {Asc|he} und {Ga|se} aus {d|em} Krater {geschl|eudert}. Viele {Vulk|ane} liegen {a|n} den Rändern der Erdplatten, zum Beispiel rund um den Pazifik. Der Ätna auf Sizilien gehört zu den aktivsten Vulkanen Europas."}, {"id": "wiki-t14", "title": "Wikipedia · Text 14 – Elefanten", "source": "Wikipedia (de) – Artikel „Elefanten“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Elefanten sind die größten Landtiere der Erde. Man {untersc|heidet} den {Afrikan|ischen} und {d|en} Asiatischen {Elefa|nten}, die {si|ch} vor {all|em} an {d|er} Größe {ihr|er} Ohren {erke|nnen} lassen. {D|ie} Tiere {leb|en} in {Her|den}, die {v|on} einer {erfah|renen} Kuh {angef|ührt} werden. {M|it} ihrem {Rüs|sel} können {s|ie} greifen, {trin|ken} und {riec|hen}. Pro Tag fressen sie mehr als hundert Kilogramm Pflanzen und legen dafür oft weite Strecken zurück. Wegen der Jagd nach Elfenbein sind viele Bestände stark zurückgegangen."}, {"id": "wiki-t15", "title": "Wikipedia · Text 15 – Mozart", "source": "Wikipedia (de) – Artikel „Wolfgang Amadeus Mozart“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Wolfgang Amadeus Mozart wurde im Jahr 1756 in Salzburg geboren. Schon {a|ls} kleines {Ki|nd} spielte {e|r} hervorragend {Klav|ier} und {Gei|ge} und {tr|at} mit {sei|nem} Vater {u|nd} seiner {Schwe|ster} an {europä|ischen} Fürstenhöfen {a|uf}. Später {z|og} er {na|ch} Wien, {w|o} er {a|ls} freier {Kompo|nist} arbeitete. {E|r} schrieb {zahlr|eiche} Sinfonien, {Konz|erte} und {Ope|rn}, darunter die Zauberflöte. Seine Musik wird bis heute auf der ganzen Welt gespielt. Mozart starb bereits mit fünfunddreißig Jahren."}, {"id": "wiki-t16", "title": "Wikipedia · Text 16 – Solarenergie", "source": "Wikipedia (de) – Artikel „Solarenergie“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Solarenergie nutzt die Strahlung der Sonne zur Gewinnung von Strom oder Wärme. In {Solarz|ellen} wird {d|as} Licht {dir|ekt} in {elektr|ischen} Strom {umgewa|ndelt}. Solche {Zel|len} bestehen {mei|st} aus {Sili|zium} und {wer|den} zu {gro|ßen} Modulen {zusamme|ngefügt}. Man {fin|det} sie {a|uf} Hausdächern {ebe|nso} wie {a|uf} freien {Feld|ern}. Ein {Nach|teil} ist, {da|ss} nachts {u|nd} bei {bewöl|ktem} Himmel weniger Energie erzeugt wird. Deshalb braucht man Batterien, um den Strom zu speichern."}, {"id": "wiki-t17", "title": "Wikipedia · Text 17 – Schlaf", "source": "Wikipedia (de) – Artikel „Schlaf“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Schlaf ist ein natürlicher Ruhezustand, der für die Gesundheit unverzichtbar ist. Während {w|ir} schlafen, {erh|olt} sich {d|er} Körper {u|nd} das {Geh|irn} verarbeitet {d|ie} Eindrücke {d|es} Tages. {D|ie} Nacht {best|eht} aus {mehr|eren} Zyklen, {d|ie} jeweils {et|wa} neunzig {Minu|ten} dauern. {Erwac|hsene} brauchen {i|m} Durchschnitt {sie|ben} bis {ne|un} Stunden {Sch|laf}. Wer {dauer|haft} zu {wen|ig} schläft, kann sich schlechter konzentrieren und wird häufiger krank. Deshalb sollte man auf regelmäßige Schlafzeiten achten."}, {"id": "wiki-t18", "title": "Wikipedia · Text 18 – Tee", "source": "Wikipedia (de) – Artikel „Tee“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Tee gehört nach Wasser zu den meistgetrunkenen Getränken der Welt. Er {wi|rd} aus {d|en} Blättern {d|er} Teepflanze {herges|tellt}, die {ursprü|nglich} aus {Chi|na} stammt. {J|e} nach {Verarb|eitung} unterscheidet {m|an} zum {Beis|piel} grünen {u|nd} schwarzen {T|ee}. Für {schwa|rzen} Tee {wer|den} die {Blät|ter} fermentiert, {wodu|rch} sie {dun|kel} werden {u|nd} ein {kräfti|geres} Aroma {beko|mmen}. Heute wird Tee auch in Indien, Kenia und Sri Lanka angebaut. In Ostfriesland trinkt man besonders viel davon."}, {"id": "wiki-t19", "title": "Wikipedia · Text 19 – Regenwald", "source": "Wikipedia (de) – Artikel „Tropischer Regenwald“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Tropische Regenwälder wachsen in warmen Gebieten mit sehr viel Niederschlag. Der {grö|ßte} zusammenhängende {Regen|wald} der {Er|de} liegt {i|m} Amazonasbecken {i|n} Südamerika. {Obw|ohl} diese {Wäl|der} nur {ein|en} kleinen {Te|il} der {Landf|läche} bedecken, {le|bt} dort {e|in} großer {Te|il} aller Tier- und {Pflanze|narten}. Außerdem {speic|hern} die {Bäu|me} große {Men|gen} Kohlenstoff. {Dur|ch} Rodung {f|ür} Ackerland {ge|ht} jedes Jahr ein Stück davon verloren. Deshalb fordern viele Experten einen besseren Schutz."}, {"id": "wiki-t20", "title": "Wikipedia · Text 20 – Eisenbahn", "source": "Wikipedia (de) – Artikel „Eisenbahn“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Eisenbahn veränderte im neunzehnten Jahrhundert das Reisen und den Handel. Die {ers|te} Strecke {i|n} Deutschland {wur|de} 1835 {zwis|chen} Nürnberg {u|nd} Fürth {eröf|fnet}. Sie {w|ar} nur {wen|ige} Kilometer {la|ng}, doch {ba|ld} entstand {e|in} dichtes {Ne|tz} aus {Schi|enen}. Dadurch {konn|ten} Waren {u|nd} Menschen {vi|el} schneller {transpo|rtiert} werden {a|ls} mit {Pferde|wagen}. Auch {d|ie} Industrie profitierte, weil Kohle und Stahl leicht in alle Regionen gelangten. Heute fahren viele Züge elektrisch."},{"id": "wiki-t21", "title": "Wikipedia · Text 21 – Berliner Mauer", "source": "Wikipedia (de) – Artikel „Berliner Mauer“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Berliner Mauer teilte von 1961 bis 1989 die Stadt Berlin in einen östlichen und einen westlichen Teil. Die {Regi|erung} der DDR ließ {s|ie} im {Aug|ust} 1961 {ba|uen}, weil {im|mer} mehr {Mens|chen} das {La|nd} in {Rich|tung} Westen {verl|assen} hatten. {D|ie} Grenzanlage {w|ar} insgesamt {ru|nd} 155 {Kilo|meter} lang {u|nd} umschloss {ga|nz} West-Berlin. {W|er} trotzdem {vers|uchte} zu {fli|ehen}, geriet {i|n} große {Gef|ahr}, und {vi|ele} Menschen {verl|oren} dabei {i|hr} Leben. {A|m} 9. November 1989 öffneten die Behörden überraschend die Grenze, und Tausende feierten an der Mauer. Danach wurde der größte Teil der Anlage abgerissen. Heute erinnern nur noch einzelne Reste und eine Gedenkstätte an die Teilung der Stadt. Die Wiedervereinigung Deutschlands folgte am 3. Oktober 1990."},{"id": "wiki-t22", "title": "Wikipedia · Text 22 – Photosynthese", "source": "Wikipedia (de) – Artikel „Photosynthese“ (Inhalt gekürzt und als C-Test bearbeitet)", "text": "Die Photosynthese ist ein Prozess, bei dem Pflanzen, Algen und manche Bakterien Lichtenergie in chemische Energie umwandeln. Dafür {neh|men} sie {Kohlenst|offdioxid} aus {d|er} Luft {u|nd} Wasser {a|us} dem {Bo|den} auf. {Mith|ilfe} des {grü|nen} Farbstoffs {Chlor|ophyll}, der {si|ch} in {d| const HW=`ab|prep + Dat: starting from (ab Montag, ab 8 Uhr); "ab und zu" = sometimes
am|an + dem: days, dates, parts of the day (am Montag, am Abend); "am besten" (superlative); am Fenster/See
an|prep: denken an, teilnehmen an, sich erinnern an; an der Wand, an einem Tag
auf|warten auf, sich freuen auf, achten auf; on top of (auf dem Tisch); auf Deutsch
aus|origin/material: aus Berlin, aus Holz; bestehen aus; aus dem Haus
als|after a comparative (größer als); single past event (als ich klein war); als Lehrer
also|so / therefore, often at the start of a sentence
aber|but – contrast; verb stays in normal position
auch|also / too; "nicht nur … sondern auch"
alle|all (plural): alle Leute; "alles" = everything
allein|alone
alt|old – adjective, check the ending
andere|other(s) – adjective ending: die anderen, ein anderer
anders|differently
außer|prep + Dat: except, besides

['1 · Count the letters first (the biggest trick)',`<p>In official C-Tests the <b>second half</b> of the word is deleted and the first half is kept (rounded down). So the missing part is <b>as long as the given part, or one letter longer</b>.</p>
<table><tr><th>Letters given</th><th>Whole word has</th><th>Examples</th></tr>

['4 · Look-alikes: how to decide',`<table>
<tr><th>Pair</th><th>Decide like this</th></tr>
<tr><td><b>das / dass</b></td><td>Can you replace it with <i>dieses / welches</i>? → <b>das</b>. Does it start a clause after a comma, after verbs like sagen, glauben, wissen, hoffen, with the verb at the end? → <b>dass</b>.</td></tr>
<tr><td><b>den / denn / dann</b></td><td><b>den</b> = article (masc. Akk / Dat plural). <b>denn</b> = "because", verb right after the subject. <b>dann</b> = "then", verb right after it.</td></tr>
<tr><td><b>wenn / als / wann</b></td><td><b>wenn</b> = if, or whenever (repeated, present, future). <b>als</b> = one single event in the past, or after a comparative. <b>wann</b> = a question about time.</td></tr>
<tr><td><b>wie / als</b></td><td>Equal → <b>wie</b> (so groß wie, genauso … wie). Unequal comparative → <b>als</b> (größer als).</td></tr>
<tr><td><b>weil / denn / da</b></td><td><b>weil</b> and <b>da</b>: verb at the end. <b>denn</b>: normal order.</td></tr>
<tr><td><b>aber / sondern</b></td><td><b>sondern</b> only after a negation: nicht heute, <i>sondern</i> morgen. Otherwise <b>aber</b>.</td></tr>
<tr><td><b>kein / nicht</b></td><td><b>kein</b> replaces <i>ein</i> or no article before a noun. <b>nicht</b> negates verbs, adjectives, adverbs, and nouns with a definite article.</td></tr>
<tr><td><b>an / auf / in</b></td><td><b>an</b> = at a side, wall, edge, water (an der Wand, am See). <b>auf</b> = on top of a flat surface, or at public places and events (auf der Post, auf der Party). <b>in</b> = inside something, cities, countries, months.</td></tr>
<tr><td><b>in / im / ins</b>, <b>an / am / ans</b>, <b>zu / zum / zur</b>, <b>bei / beim</b>, <b>von / vom</b></td><td>Contractions: <b>im, am, zum, beim, vom</b> = + dem (masc/neut Dat). <b>zur</b> = zu der (fem). <b>ins, ans</b> = + das (neuter direction).</td></tr>
<tr><td><b>ihn / ihm / ihr / ihnen</b></td><td><b>ihn</b> = him (Akk). <b>ihm</b> = to him (Dat). <b>ihr</b> = to her, or "you all", or "her". <b>ihnen</b> = to them.</td></tr>
<tr><td><b>sie / sich</b></td><td><b>sich</b> refers back to the subject (er freut sich). <b>sie</b> is a different person: she / they / her.</td></tr>
<tr><td><b>viel / viele</b></td><td><b>viel</b> + uncountable singular (viel Geld). <b>viele</b> + plural (viele Leute).</td></tr>
<tr><td><b>wird / werden / wurde</b></td><td><b>wird</b> = er/sie/es. <b>werden</b> = wir/sie, or infinitive after a modal. <b>wurde</b> = past, often passive with a Partizip II at the end.</td></tr>
<tr><td><b>sein / seit / seine</b></td><td><b>seit</b> + time period (seit zwei Jahren). <b>sein/seine</b> = his, or the verb "to be".</td></tr>
<tr><td><b>noch / nach / nur / nun</b></td><td><b>noch</b> still/another; <b>nach</b> after/to; <b>nur</b> only; <b>nun</b> now.</td></tr></table>`],
['5 · Cases: articles and pronouns',`<table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>

<li><b>um:</b> sich kümmern, bitten, sich bewerben, es geht um</li>
<li><b>von:</b> träumen, abhängen, erzählen, halten</li>

<li><b>aus:</b> bestehen, kommen &nbsp;·&nbsp; <b>zu:</b> gehören, einladen, passen</li></ul>`],
['7 · Conjunctions and word order',`<table><tr><th>Type</th><th>Words</th><th>What the verb does</th></tr>
<tr><td><b>Subordinating</b></td><td>dass, weil, wenn, als, ob, obwohl, damit, bevor, nachdem, während, bis, seit(dem), falls, sobald, indem, sodass</td><td>goes to the <b>end</b> of the clause</td></tr>
<tr><td><b>Main-clause links</b></td><td>und, aber, oder, denn, sondern</td><td>no change (position 2)</td></tr>
<tr><td><b>Adverb connectors</b></td><td>deshalb, deswegen, darum, daher, trotzdem, dann, danach, außerdem, also, sonst, dennoch, jedoch</td><td>comes <b>right after</b> the connector</td></tr></table>
<p><b>The trick:</b> look at the next verb. If it is at the end of the clause (or a Partizip + helper at the end), the gap is a subordinating word. If the verb comes straight after the gap, it is an adverb connector.</p>
<p><b>Pairs:</b> entweder … oder · sowohl … als auch · nicht nur … sondern auch · weder … noch · zwar … aber · je … desto · um … zu · ohne … zu · (an)statt … zu.</p>`],
['8 · Adjective endings',`<table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td colspan="5"><b>after der / die / das / dieser…</b></td></tr>
<tr><td>Nom</td><td>-e</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><td>Akk</td><td>-en</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><td>Dat / Gen</td><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr>
<tr><td colspan="5"><b>after ein / kein / mein…</b></td></tr>
<tr><td>Nom</td><td>-er</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><td>Akk</td><td>-en</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><td>Dat / Gen</td><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr>
<tr><td colspan="5"><b>no article</b></td></tr>
<tr><td>Nom</td><td>-er</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><td>Akk</td><td>-en</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><td>Dat</td><td>-em</td><td>-er</td><td>-em</td><td>-en</td></tr><tr><td>Gen</td><td>-en</td><td>-er</td><td>-en</td><td>-er</td></tr></table>
<ul><li>If the article <b>already shows</b> the case (der, die, das, den, dem, des), the adjective is almost always <b>-e</b> or <b>-en</b>.</li>
<li>If the article does <b>not</b> show it (ein, kein, mein or nothing), the adjective carries the ending: <b>-er, -es, -em</b> …</li>
<li><b>-en</b> is the most common answer overall. Dative and genitive after an article are always -en.</li>
<li>Spelling changes: hoch → hohe, teuer → teure, dunkel → dunkle.</li>
<li>Comparative: -er (+ als). Superlative: am …-sten, or der/die/das …-ste.</li></ul>`],
['9 · Verb forms',`<table><tr><th>Person</th><th>Ending</th><th>Example</th></tr>
<tr><td>ich</td><td>-e</td><td>ich lerne</td></tr><tr><td>du</td><td>-st</td><td>du lernst</td></tr><tr><td>er / sie / es / man</td><td>-t</td><td>er lernt</td></tr><tr><td>wir</td><td>-en</td><td>wir lernen</td></tr><tr><td>ihr</td><td>-t</td><td>ihr lernt</td></tr><tr><td>sie / Sie</td><td>-en</td><td>sie lernen</td></tr></table>
<ul><li><b>Find the subject first.</b> The ending must match it.</li>
<li>Vowel change in du / er: fahren → fährt, sprechen → spricht, lesen → liest. Stems ending in -t/-d add -e-: arbeitet, findet.</li>
<li><b>Modals</b> (können, müssen, wollen, sollen, dürfen, möchte): ich and er have no ending (ich kann, er muss). The second verb is an infinitive at the end, <b>without</b> zu.</li>
<li><b>Perfekt:</b> haben / sein + Partizip II at the end. Regular: <b>ge-…-t</b> (gemacht). Irregular: <b>ge-…-en</b> (gegangen).</li>
<li><b>Separable prefix:</b> ge goes in the middle (aufgestanden, eingekauft). <b>Inseparable</b> be-, ent-, er-, ver-, zer-, miss-, ge- and verbs on -ieren have <b>no ge-</b> (bekommen, verstanden, studiert).</li>
<li><b>sein</b> is used for movement and change of state: gehen, fahren, kommen, bleiben, werden, aufstehen, passieren.</li>
<li><b>Präteritum:</b> regular -te, -test, -te, -ten, -tet, -ten; sein war/waren, haben hatte; modals konnte, musste, wollte, sollte, durfte.</li>
<li><b>Separable verbs:</b> the particle sits at the end of the clause (Der Zug fährt um acht ab). A short gap at the end is often ab, an, auf, aus, ein, mit, vor, zu, zurück, weg.</li>
<li><b>zu + infinitive:</b> zu arbeiten, but aufzustehen with a separable verb (zu goes in the middle).</li>
<li><b>Passiv:</b> werden + Partizip II (Das Haus wird gebaut). <b>Konjunktiv II:</b> wäre, hätte, würde + infinitive.</li></ul>`],
['10 · Nouns: gender and plural',`<table><tr><th>Suffix</th><th>Gender</th></tr>
<tr><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik, -ei, -in</td><td>die (feminine)</td></tr>
<tr><td>-er (people), -ismus, -ling, -or</td><td>der (masculine)</td></tr>
<tr><td>-chen, -lein, -ment, -um</td><td>das (neuter)</td></tr></table>
<ul><li><b>Plural:</b> feminine mostly -en / -n (Frau → Frauen, -ung → -ungen, -in → -innen). Masculine often -e, sometimes with umlaut (Tag → Tage, Sohn → Söhne). Neuter -e or -er with umlaut (Kind → Kinder, Haus → Häuser). Words on -er / -el / -en often do not change (Lehrer, Mädchen). Foreign words often -s (Autos).</li>
<li><b>Dative plural</b> adds -n (den Kindern, mit den Freunden).</li>
<li><b>Genitive</b> masculine/neuter adds -s or -es (des Mannes, des Hauses).</li>
<li><b>n-nouns</b> (der Student, der Name, der Kollege) end in -n/-en in every case except Nominativ singular.</li>
<li><b>Compound nouns:</b> the <b>last part</b> decides gender and plural (der Bahnhof). A gap is often the second part: Arbeits|platz, Bahn|hof.</li></ul>`],
['11 · Word-building clues',`<ul><li><b>Adjective suffixes:</b> -lich, -ig, -isch, -bar, -los, -voll, -sam, -haft (freundlich, wichtig, typisch, machbar, arbeitslos).</li>
<li><b>Adverb suffixes:</b> -weise, -lich with time words (täglich), -s with time words (montags, abends).</li>
<li><b>Prefixes:</b> un- negates (unmöglich), vor- / nach- (before / after), über- / unter-, zusammen-, wieder-.</li>
<li><b>Verb prefixes:</b> be-, ent-, er-, ver-, zer-, miss- are inseparable; an-, auf-, aus-, ein-, mit-, vor-, zu-, zurück-, weg- are separable.</li>
<li><b>Verb → noun:</b> -ung (Wohnung), -er for the person (Lehrer), infinitive as a neuter noun (das Lernen).</li></ul>`],
['12 · Strategy',`<ul><li><b>Read the first sentence</b>, which has no gaps. It gives you the topic and vocabulary.</li>
<li><b>Do the easy gaps first</b> (short function words), then the topic words.</li>
<li><b>Use the word after the gap, not only before it.</b> An article tells you the gender, <i>zu</i> before a gap means an infinitive, a verb at the end means <i>dass / weil / wenn</i>.</li>
<li><b>Count letters</b> (see section 1) and check the capital letter (section 2).</li>
<li>You only type the <b>missing part</b>. Your answer has to continue the letters that are shown.</li>
<li><b>Never leave a gap empty.</b> A guess costs nothing.</li>
<li>Check spelling: ß / ss, umlauts, double letters. Capitals do not matter in this app.</li>
<li>Don't spend more than about 20 seconds on one gap. Come back to it.</li>
<li>After checking, look at the red answers and ask which rule above you missed.</li></ul>`],
['13 · When the text rounds up',`<p>Some texts (and the Blitz mini-texts) give half the letters rounded <b>up</b>. An odd-length word then shows one more letter than usual: <b>der</b> is <b>d|er</b> normally, but <b>de|r</b> here. The finder hides these words by default. Below are all odd-length words split that way, with the clue for each.</p>`+rupHtml()]
];
